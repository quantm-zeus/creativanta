<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#11121a"/>
<title>Creativanta — Studio workspace V4</title>
<style>/* CREATIVANTA STUDIO / V4 - fresh information architecture, not a V3 reskin.
   Distinctive restrained creator-commerce OS; all business figures are demo. */
:root{
 --sidebar:#151620;--sidebar-lift:#22232f;--canvas:#f8f8fa;--paper:#ffffff;
 --ink:#22232e;--strong:#14151d;--secondary:#707382;--soft:#9b9cab;
 --edge:#ececf0;--accent:#6c5ce7;--accent-deep:#5544cb;--accent-pale:#f1efff;
 --mint:#169b7b;--mint-pale:#ebf8f3;--orange:#d17945;--orange-pale:#fff4e9;
 --danger:#d65461;--danger-pale:#fff0f0;--radius:16px;--small-radius:11px;
 --shadow:0 12px 38px rgba(21,20,45,.035);
 --ui:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{padding:0;margin:0;width:100%;min-height:100%;background:var(--canvas)}
body{color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.48;cursor:default}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid rgba(108,92,231,.45)!important;outline-offset:3px}
button,.btn{transition:background .15s,color .15s,border-color .15s,transform .15s}
svg{display:block;flex-shrink:0}
#app{min-height:100dvh}
.shell{min-height:100dvh;display:flex}
.side{width:236px;min-width:236px;background:var(--sidebar);color:#a3a5b6;display:flex;
 flex-direction:column;position:sticky;top:0;max-height:100dvh;height:100dvh;z-index:60}
.side-head{padding:27px 19px 18px;border-bottom:1px solid rgba(255,255,255,.055)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:16px;letter-spacing:-.05em;font-weight:760;white-space:nowrap}
.brandmark{width:31px;height:31px;border-radius:10px;position:relative;background:linear-gradient(140deg,#9686ff,#6b57eb);box-shadow:0 5px 18px rgba(107,84,255,.23);display:grid;place-items:center;overflow:hidden}
.brandmark span{width:15px;height:15px;display:block;border:3px solid #fff;border-radius:5px;transform:rotate(-18deg)}
.workspace{display:flex;align-items:center;gap:9px;color:#dcdde9;margin-top:29px;padding:11px 10px;border:1px solid #343541;border-radius:11px;min-width:0;background:#20212b;text-align:left;width:100%}
.workspace:hover{background:#282936}
.workspace .avatar-mini{width:26px;height:26px;border-radius:8px;background:#454153;color:#ebdeff;font-weight:760;font-size:11px;display:grid;place-items:center}
.workspace strong{display:block;font-weight:650;font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workspace small{display:block;color:#9294a7;font-size:10px;margin-top:3px}
.workspace .chev{margin-left:auto;color:#a4a6b8}
.side-content{padding:18px 11px 16px;overflow-y:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:#383a4c transparent}
.nav-label{padding:0 11px;margin-bottom:9px;text-transform:uppercase;font-size:10px;letter-spacing:.115em;color:#65697b;font-weight:700}
.nav-item{width:100%;color:#999cad;display:flex;align-items:center;gap:12px;text-align:left;
 background:transparent;border:0;border-radius:10px;padding:12px 12px;margin:1px 0;
 font-size:12.5px;font-weight:550;min-height:43px;position:relative}
.nav-item:hover{background:#20212c;color:#f0f0fb}
.nav-item.active{background:#302d42;color:white;font-weight:650}
.nav-item.active:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:9px;background:#ab9eff}
.nav-item.active .ni{color:#b9aeff}
.nav-item .ni{width:18px;height:18px;stroke-width:1.7}
.nav-item .nav-count{margin-left:auto;color:#8f88c7;background:#373148;border-radius:6px;min-width:21px;font-size:10px;font-weight:700;padding:2px 5px;text-align:center}
.side-divider{height:1px;background:#2d2d39;margin:20px 11px}
.shortcut{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1px solid #363743;
 background:#1c1e2a;color:#aeb0c0;border-radius:10px;padding:10px 11px;margin:5px 0 10px;font-size:11px}
.shortcut:hover{border-color:#7069b0;color:#fff}
.shortcut kbd{margin-left:auto;color:#777a90;border:1px solid #4b4a5d;border-radius:5px;padding:1px 4px;font-size:10px}
.side-bottom{border-top:1px solid #2d2c39;padding:16px 11px 20px}
.side-help{border:0;background:transparent;color:#999bac;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;font-size:12px}
.side-help:hover{background:#242531;color:white}
.side-foot{padding:13px 9px 0;margin-top:4px;display:flex;gap:10px;align-items:center;color:#dadce9;border-top:1px solid #2d2e3b}
.profile{height:32px;width:32px;border-radius:50%;background:#e9e1dc;color:#594938;display:grid;place-items:center;font-size:12px;font-weight:800}
.profile-txt strong{font-size:11.5px;font-weight:650;display:block}
.profile-txt small{font-size:10px;color:#85899e;display:block}
.surface{min-width:0;flex:1;background:var(--canvas);display:flex;flex-direction:column;min-height:100dvh}
.top{height:67px;min-height:67px;display:flex;align-items:center;gap:16px;padding:0 clamp(22px,3vw,45px);border-bottom:1px solid #efeff2;background:rgba(255,255,255,.94);position:sticky;top:0;z-index:40;backdrop-filter:blur(14px)}
.crumbs{display:flex;gap:8px;align-items:center;color:#9395a1;font-size:12px;min-width:0}
.crumbs strong{color:#393a47;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-end{display:flex;gap:10px;align-items:center;margin-left:auto}
.search-trigger{min-width:235px;height:36px;border:1px solid var(--edge);background:#fbfbfc;border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 12px;color:#9798a5;font-size:12px}
.search-trigger:hover{background:#f5f3ff;border-color:#ded9fa}
.search-trigger kbd{margin-left:auto;color:#a5a5b1;font-size:10px;background:#f1f1f4;padding:3px 5px;border-radius:5px}
.iconbutton{border:0;border-radius:10px;background:transparent;color:#777889;display:grid;place-items:center;position:relative;width:36px;height:36px}
.iconbutton:hover{background:#f1efff;color:#6755d8}
.iconbutton .dot{position:absolute;right:8px;top:7px;width:5px;height:5px;background:#f2996a;border:2px solid #fff;box-sizing:content-box;border-radius:50%}
.tiny-user{width:34px;height:34px;border-radius:11px;background:#ede8ff;color:#5745c4;display:grid;place-items:center;font-size:11px;font-weight:800}
.demo-label{font-size:10px;color:#9597a4;letter-spacing:.02em}
.menu-trigger{display:none}
.content{padding:35px clamp(23px,3.8vw,58px) 85px;max-width:1540px;width:100%;margin:auto;flex:1}
.page-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:25px}
.page-intro small{font-size:11px;font-weight:750;letter-spacing:.115em;text-transform:uppercase;color:#aaaab5}
.page-intro h1{font-size:clamp(27px,2.65vw,40px);letter-spacing:-.052em;margin:8px 0 7px;line-height:1.14;color:#22232c;font-weight:730}
.page-intro p{margin:0;color:#858694;font-size:13px;max-width:640px}
.page-actions{display:flex;align-items:center;gap:9px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
 min-height:40px;border:1px solid var(--edge);background:white;padding:10px 14px;color:#444657;font-size:12px;font-weight:660;white-space:nowrap}
.btn:hover{background:#f7f6ff;border-color:#dcd8fb}
.btn.dark{background:#252330;border-color:#252330;color:white}
.btn.dark:hover{background:#434054;transform:translateY(-1px)}
.btn.accent{background:#6654df;border-color:#6654df;color:#fff}
.btn.accent:hover{background:#5843cd;border-color:#5843cd}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:#efedf8}
.btn.small{font-size:11px;min-height:33px;padding:7px 11px}
.tabbar{display:flex;gap:23px;border-bottom:1px solid #eaeaf0;overflow:auto;scrollbar-width:none;margin:0 0 23px}
.tabbar::-webkit-scrollbar{display:none}
.tab{font-size:12px;padding:12px 1px 13px;color:#91929e;background:none;border:0;border-bottom:2px solid transparent;white-space:nowrap;font-weight:590}
.tab.active{color:#4d43b2;border-bottom-color:#7162e5;font-weight:730}
.tab:hover{color:#5141bf}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border:1px solid var(--edge);background:var(--edge);border-radius:16px;overflow:hidden;margin-bottom:21px}
.metric{background:white;padding:17px 19px;min-width:0;position:relative}
.metric .m-label{font-size:11px;color:#9293a0;display:flex;justify-content:space-between;align-items:center;gap:5px}
.metric .m-value{font-size:25px;font-weight:720;line-height:1.25;margin-top:8px;color:#222331;letter-spacing:-.047em;overflow-wrap:anywhere}
.metric .m-foot{font-size:10.5px;color:#9293a1;margin-top:6px}
.gain{color:#178e6f!important}
.loss{color:#cc6754!important}
.pill{font-size:10px;display:inline-flex;gap:4px;align-items:center;line-height:1.2;border-radius:99px;padding:5px 9px;font-weight:660}
.pill.purple{color:#6b58ca;background:#f0edff}
.pill.green{color:#188568;background:#e8f8f0}
.pill.orange{color:#ad6a3c;background:#fff2e6}
.pill.gray{color:#848795;background:#f2f2f5}
.pill.red{color:#bf5964;background:#ffebed}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 15px}
.section-title h2{margin:0;font-size:16px;line-height:1.3;font-weight:720;color:#2e2d3b;letter-spacing:-.025em}
.section-title p{font-size:11px;color:#9999a6;margin:4px 0 0}
.link{border:0;background:transparent;color:#6355c7;font-size:11.5px;font-weight:660;display:inline-flex;gap:5px;align-items:center}
.link:hover{color:#382b9e}
.page-grid{display:grid;grid-template-columns:minmax(0,1.53fr) minmax(300px,.9fr);gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--edge);border-radius:16px;overflow:hidden;min-width:0}
.panel-head{padding:21px 22px 15px;display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.panel-head h3{font-size:14px;font-weight:720;margin:0;letter-spacing:-.015em}
.panel-head p{font-size:11px;color:#9999a5;margin:3px 0 0}
.panel-body{padding:4px 22px 20px}
.panel-foot{padding:12px 22px;border-top:1px solid #f0eff4;background:#fcfcfd;color:#9395a5;font-size:10px}
.feature{background:#252436;border-radius:17px;padding:26px;display:grid;grid-template-columns:1fr minmax(130px,.5fr);gap:18px;min-height:250px;position:relative;overflow:hidden;margin-bottom:21px;color:#fff}
.feature:before{content:"";position:absolute;inset:0 0 0 62%;background:radial-gradient(circle at 90% 20%,rgba(147,136,255,.33),transparent 65%);pointer-events:none}
.feature small{font-size:10px;letter-spacing:.11em;color:#b6aef4;font-weight:720}
.feature h2{max-width:470px;font-size:clamp(22px,2.6vw,32px);font-weight:680;line-height:1.21;letter-spacing:-.045em;margin:14px 0 10px}
.feature p{max-width:420px;font-size:12px;line-height:1.65;color:#b6b6c7;margin:0 0 23px}
.feature .btn{background:#fff;border-color:#fff;color:#343044}
.feature-art{height:190px;align-self:center;display:flex;align-items:flex-end;justify-content:center;position:relative}
.ring{position:absolute;width:175px;height:175px;border-radius:50%;border:1px solid rgba(209,207,255,.17);bottom:6px}
.ring.r2{width:127px;height:127px;bottom:29px}
.signal{position:absolute;bottom:25px;left:15px;right:15px;height:112px;border:1px solid rgba(229,220,255,.18);background:rgba(255,255,255,.055);border-radius:12px;display:flex;gap:8px;align-items:flex-end;padding:17px 16px}
.signal i{flex:1;border-radius:4px 4px 2px 2px;display:block;background:linear-gradient(180deg,#bdb5ff,#796ce4)}
.signal i:nth-child(even){background:linear-gradient(180deg,#75cfb9,#458e93)}
.signal .signal-label{position:absolute;left:17px;top:11px;font-size:9px;color:#c1bfdc;letter-spacing:.06em}
.focus-list{padding:0 19px 8px}
.focus-row{display:flex;gap:12px;align-items:center;padding:15px 3px;border-top:1px solid #f0f0f2}
.focus-row:first-child{border-top:0}
.check{width:19px;height:19px;border:1.5px solid #dadce5;border-radius:6px;background:#fff;flex-shrink:0;display:grid;place-items:center;color:white}
.check.checked{background:var(--mint);border-color:var(--mint)}
.focus-text{min-width:0;flex:1}
.focus-text strong{display:block;font-size:12px;font-weight:680;line-height:1.35}
.focus-text small{font-size:10.5px;color:#a0a1ad;display:block;margin-top:3px}
.focus-row.done .focus-text strong{text-decoration:line-through;color:#aaaab6}
.focus-arrow{color:#a3a4ae;border:0;background:transparent;width:24px;height:26px;display:grid;place-items:center}
.focus-arrow:hover{color:#6854d1}
.progressline{display:flex;gap:5px;margin:8px 22px 17px}
.progressline i{flex:1;height:5px;border-radius:9px;background:#e9e9ef}
.progressline i.filled{background:#796be9}
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:18px 4px 8px}
.pipe{padding:8px 11px 4px;position:relative;min-width:0}
.pipe:before{content:"";position:absolute;left:23px;right:-7px;top:21px;height:1px;background:#e5e5ed}
.pipe:last-child:before{display:none}
.pipe .p-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;color:#7f82a0;background:#f3f3f8;position:relative;z-index:1;margin-bottom:12px}
.pipe.done .p-icon{background:#edeaff;color:#6b59dc}
.pipe.active .p-icon{background:#5e52d6;color:#fff}
.pipe strong{display:block;font-size:11px;font-weight:650;color:#545665}
.pipe small{display:block;font-size:10px;color:#a4a5b0;margin-top:3px}
.list-row{padding:13px 20px;display:flex;align-items:center;gap:13px;border-bottom:1px solid #f0f0f3;cursor:pointer;min-width:0}
.list-row:last-child{border-bottom:0}
.list-row:hover{background:#faf9fe}
.tile-icon{height:37px;width:37px;border-radius:10px;display:grid;place-items:center;background:#f3f0ff;color:#7667db;flex-shrink:0}
.tile-icon.mint{background:#ecf8f2;color:#289577}
.tile-icon.orange{background:#fff4eb;color:#bc7546}
.tile-icon.blue{background:#eff4fd;color:#6386c4}
.tile-icon.red{background:#fff0f0;color:#c96b70}
.list-core{min-width:0;flex:1}
.list-core strong{font-size:12px;font-weight:670;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.list-core small{font-size:10.5px;color:#9a9ca9;display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-right{display:flex;align-items:center;gap:10px;color:#a3a5b0}
.list-right b{font-size:11px;color:#555562;font-weight:650}
.card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.item-card{padding:19px;background:white;border:1px solid var(--edge);border-radius:15px;min-width:0;display:flex;flex-direction:column;gap:9px}
.item-card:hover{border-color:#dad5fa;box-shadow:0 9px 24px rgba(35,29,82,.04)}
.item-card h3{font-size:14px;font-weight:690;letter-spacing:-.02em;margin:0;line-height:1.35}
.item-card p{font-size:11px;color:#9396a3;line-height:1.55;margin:0;flex:1}
.item-card .item-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f1f1f4;padding-top:12px;margin-top:10px}
.item-card .item-foot small{font-size:10px;color:#a7a8b3}
.mini-chart{height:50px;width:100%;display:flex;gap:4px;align-items:flex-end}
.mini-chart i{width:calc(100% / 14);height:var(--h);display:block;background:linear-gradient(180deg,#aea5ff,#e6e1ff);border-radius:3px 3px 0 0}
.mini-chart i:nth-child(3n){background:linear-gradient(180deg,#9bddd1,#d7f4eb)}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:17px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:33px;padding:7px 12px;border:1px solid var(--edge);color:#828391;background:#fff;border-radius:9px;font-size:11px;font-weight:600}
.chip.active{border-color:#dbd6ff;background:#f3f0ff;color:#5e4cc5}
.row-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
.threadlist{border:1px solid var(--edge);border-radius:15px;background:#fff;overflow:hidden}
.thread{padding:16px 15px;border-bottom:1px solid #f1f1f4;text-align:left;background:white;border-left:3px solid transparent;display:flex;gap:10px}
.thread:last-child{border-bottom:0}
.thread.active{background:#f7f5ff;border-left-color:#705ce7}
.thread .thread-avatar{width:32px;height:32px;flex-shrink:0;border-radius:50%;background:#f0edf8;display:grid;place-items:center;font-weight:700;color:#775fd5}
.thread strong{display:block;font-size:11px;font-weight:700}
.thread p{margin:4px 0;color:#9394a2;font-size:11px;line-height:1.45}
.chatbox{background:#fff;border:1px solid var(--edge);border-radius:15px;display:flex;flex-direction:column;min-height:420px;overflow:hidden}
.chathead{height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0eff4;padding:0 19px}
.chatmessages{flex:1;padding:23px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.bubble{background:#f3f3f7;padding:11px 15px;border-radius:13px 13px 13px 3px;max-width:78%;color:#474953;font-size:12px;line-height:1.6}
.bubble.me{background:#eeeaff;color:#51459a;align-self:flex-end;border-radius:13px 13px 3px 13px}
.compose{padding:15px;border-top:1px solid #f0eff4;display:flex;gap:10px;align-items:center}
.compose input{border:1px solid #ececf2;background:#fafafd;border-radius:9px;flex:1;min-height:39px;padding:9px 12px;min-width:0;font-size:12px}
.data-table{width:100%;border-collapse:collapse;text-align:left}
.table-wrap{max-width:100%;overflow:auto}
.data-table th{color:#a0a1ad;font-size:10px;font-weight:690;background:#fcfcfd;text-transform:uppercase;letter-spacing:.06em;padding:13px 17px;white-space:nowrap}
.data-table td{padding:15px 17px;border-top:1px solid #f0f0f3;color:#686979;font-size:11px;white-space:nowrap}
.data-table tr:hover td{background:#fafaff}
.data-table td strong{font-size:12px;font-weight:690;color:#353545}
.badge-dot{display:inline-flex;align-items:center;gap:7px}
.badge-dot:before{content:"";width:7px;height:7px;background:#39aa8a;border-radius:50%}
.badge-dot.orange:before{background:#d99d69}
.badge-dot.red:before{background:#d46c6a}
.chart-panel{min-width:0;background:#fff;border:1px solid var(--edge);border-radius:16px;padding:23px}
.chart-panel svg{width:100%;height:auto;max-height:220px}
.chart-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}
.chart-head strong{font-size:23px;letter-spacing:-.045em}
.chart-head small{color:#9b9caa;display:block;margin-bottom:5px}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kanban-col{background:#f0eff3;border-radius:15px;padding:12px;min-height:250px}
.kanban-title{font-size:12px;font-weight:720;padding:7px 6px 16px;display:flex;justify-content:space-between}
.kanban-title small{color:#aaa9b4;font-weight:650}
.kanban .item-card{margin-bottom:10px;gap:8px;padding:15px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:#eaeaf0;border:1px solid #eaeaf0;border-radius:14px;overflow:hidden}
.day{background:#fff;min-height:144px;padding:13px;min-width:0}
.day .dlabel{font-size:11px;color:#9999a7;font-weight:700}
.day.today{background:#fbfaff}
.event{margin-top:15px;padding:9px;border-radius:9px;background:#eeebff;border-left:2px solid #7d6fe3;color:#594db4;font-size:10px;line-height:1.4}
.event.mint{background:#e6f7f1;border-color:#41b893;color:#278969}
.event.orange{background:#fff1e5;border-color:#efaf75;color:#ab7045}
.info-strip{display:flex;align-items:center;gap:12px;background:#f2effe;border:1px solid #e9e2ff;color:#7160a7;padding:12px 16px;border-radius:12px;font-size:11px;margin-bottom:19px}
.info-strip svg{width:17px;height:17px}
.catalog-card{margin-top:24px;padding:14px 16px;border:1px dashed #dddae8;border-radius:13px;color:#878795;display:flex;gap:14px;justify-content:space-between;align-items:center;font-size:11px}

tes, and product placements. This document guides both AI generation and human production.","sections":["Purpose & Context","Layout Structure","Component Hierarchy","4-5. Data & Actions","User Actions","Validation Rules","States"],"kind":"workspace","source":"docs/03_screens/web/screen_web_content_asset_brief.md"},{"id":"W019","title":"Web — Continuity Packs","platform":"web","module":"M08","route":"/continuity","purpose":"Continuity Packs is the \"character bible\" for AI-generated content — a management hub for reusable character profiles, brand kits, and voice presets that ensure consistency across all AI-generated videos, scripts, and TTS output. When a creator sets up \"Chef Hùng\" as a character with speci","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Displayed Data / Data Binding","User Actions","States / State Machine"],"kind":"workspace","source":"docs/03_screens/web/screen_web_content_continuity.md"},{"id":"W018","title":"Web — Derivative Manager","platform":"web","module":"M09","route":"/derivatives","purpose":"Manage content derivatives — repurposed/remixed versions of original content for different platforms. Tree structure groups derivatives under their source content, showing platform-specific adaptations (aspect ratios, durations, formats) and their publish status.","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Derivative Types","User Actions","States"],"kind":"workspace","source":"docs/03_screens/web/screen_web_content_derivatives.md"},{"id":"W012","title":"Web — Idea Board","platform":"web","module":"M05","route":"/ideas","purpose":"The Idea Board is the content pipeline's front door — a Kanban-style board for capturing, scoring, prioritizing, and advancing content ideas through stages: Inbox → Evaluating → Approved → In Script → Done. Ideas can be created manually (one-click capture from anywhere), generated by AI (b","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Displayed Data / Data Binding","User Actions","States / State Machine"],"kind":"workspace","source":"docs/03_screens/web/screen_web_content_idea_board.md"},{"id":"W013","title":"Web — Idea Detail","platform":"web","module":"M05","route":"/ideas/[id]","purpose":"Full detail view of a single idea. Shows the idea's origin (manual/AI/trend/opportunity), AI score breakdown, attached references, linked scripts, and conversion actions. Also serves as the editing interface for idea enrichment.","sections":["Purpose & Context","Layout Structure","Component Hierarchy","Data Binding","Actions Table","States","Validation Rules"],"kind":"detail","source":"docs/03_screens/web/screen_web_content_idea_detail.md"},{"id":"W014","title":"Web — AI Idea Generator","platform":"web","module":"M05","route":"/ideas/generate","purpose":"The AI Idea Generator creates content ideas from natural language prompts, trends, audience data, and product catalog. Users describe what they want (\"content ideas about skincare for TikTok\"), and AI generates 10+ scored suggestions with titles, hooks, format suggestions, and estimated pe","sections":["Purpose & Context","Layout Structure","Component Hierarchy","Data Binding & Display Format","Actions Table","State Machine","Validation Rules"],"kind":"workspace","source":"docs/03_screens/web/screen_web_content_idea_generator.md"},{"id":"W016","title":"Web — Script Editor","platform":"web","module":"M06","route":"/scripts/[id]","purpose":"The Script Editor is the primary content writing workspace — a structured, AI-augmented editor with section-based composition (Hook, Body, CTA), real-time brand voice enforcement, platform-specific guidelines, version history, and a review/approval workflow. Scripts link to ideas upstream ","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Displayed Data","User Actions","Validation Rules"],"kind":"editor","source":"docs/03_screens/web/screen_web_content_script_editor.md"},{"id":"W015","title":"Web — Script List","platform":"web","module":"M06","route":"/scripts","purpose":"Script List displays all scripts in the workspace with status filtering, search, and quick stats. The bridge between the Idea Board (upstream) and the AI Studio/Publish pipeline (downstream). Designed for rapid triage — see what needs writing, reviewing, or is ready for production.","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Data Binding & Display Format","User Actions","Validation Rules"],"kind":"editor","source":"docs/03_screens/web/screen_web_content_script_list.md"},{"id":"W017","title":"Web — Script Approval Review","platform":"web","module":"M06","route":"/scripts/[id]/review","purpose":"Script review mode — read-only script view with inline commenting, approval/rejection workflow, and change request tracking. Reviewers can add feedback per section and make a final decision.","sections":["Purpose & Context","Layout Structure","Component Hierarchy","4-5. Data & Actions","States","Permission Matrix","Edge Cases"],"kind":"editor","source":"docs/03_screens/web/screen_web_content_script_review.md"},{"id":"W095","title":"Web — Brand Deal Manager","platform":"web","module":"S16","route":"/creator-pro/deals","purpose":"Brand deal tracking with full pipeline — manage partnerships from negotiation through delivery to payment. Includes deliverable checklists, payment tracking, and deal performance analytics.","sections":["Purpose & Context","Screen Layout","Deal Status Pipeline","Component Hierarchy","States","Tier Gating","Error Handling"],"kind":"workspace","source":"docs/03_screens/web/screen_web_creator_brand_deals.md"},{"id":"W135","title":"Deal Contract Templates and Evidence","platform":"web","module":"S16","route":"/creator-pro/deals/:deal_id/contracts","purpose":"Read Creator Pro §12 and API behavior §8. Brand erarchy","User Actions","Validation Rules","States"],"kind":"workspace","source":"docs/03_screens/web/screen_web_creator_rate_card.md"},{"id":"W094","title":"Web — Revenue Per Content","platform":"web","module":"S16","route":"/creator-pro/revenue","purpose":"Revenue attribution per content piece — track ROI of every video/post by connecting content creation costs to revenue generated through that content. Shows RPM (Revenue Per Mille) trends, production cost analysis, and AI-generated optimization insights.","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Key Metrics","States","Permissions & Tier Gating"],"kind":"analytics","source":"docs/03_screens/web/screen_web_creator_revenue.md"},{"id":"W096","title":"Web — Tax Report Export","platform":"web","module":"S16","route":"/creator-pro/tax-export","purpose":"Export income reports for tax filing — monthly/quarterly/yearly with income & expense breakdown by source, net calculation, multi-format export, and trust-level annotations.","sections":["Purpose & Context","Screen Layout","States","Error Handling","Accessibility","Loading Behavior","Analytics Events"],"kind":"workspace","source":"docs/03_screens/web/screen_web_creator_tax_export.md"},{"id":"W050","title":"Web — Bulk Triage","platform":"web","module":"M12","route":"/inbox/triage","purpose":"Bulk Triage is a rapid processing mode for clearing inbox backlog. Threads are presented one-at-a-time (Tinder-like card swipe UX), with pre-generated AI replies. Users can quickly approve replies, modify, assign, or skip.","sections":["Purpose & Context","Layout Structure","Component Hierarchy","4-5. Data & Actions","States","Edge Cases","Error Handling"],"kind":"workspace","source":"docs/03_screens/web/screen_web_engagement_bulk_triage.md"},{"id":"W049","title":"Web — Contact Detail","platform":"web","module":"M12","route":"/contacts/[id]","purpose":"Full profile view of a single contact — showing all interactions, purchase history, platform presence, and AI-generated engagement recommendations.","sections":["Purpose & Context","Layout Structure","Component Hierarchy","4-5. Data & Actions","States","Edge Cases","Error Handling"],"kind":"detail","source":"docs/03_screens/web/screen_web_engagement_contact_detail.md"},{"id":"W048","title":"Web — Contact List","platform":"web","module":"M12","route":"/contacts","purpose":"Contact List is a lightweight CRM showing all people who have interacted with the creator — commenters, DM senders, buyers, collaborators. AI auto-enriches profiles with purchase history, engagement frequency, and customer value scoring.","sections":["Purpose & Context","Layout Structure","Component Hierarchy","4-5. Data & Actions","Customer Value Scoring","States","Permission Matrix"],"kind":"table","source":"docs/03_screens/web/screen_web_engagement_contact_list.md"},{"id":"W051","title":"Web — Follow-up Tasks","platform":"web","module":"M12","route":"/inbox/tasks","purpose":"Follow-up Tasks tracks pending actions created from inbox threads — e.g., \"Send product sample to @customer\", \"Create special offer for VIP buyer\", \"Follow up on collaboration inquiry\". Each task links to its source thread.","sections":["Purpose & Context","Layout Structure","Component Hierarchy","4-5. Data & Actions","States","Edge Cases","Error Handling"],"kind":"workspace","source":"docs/03_screens/web/screen_web_engagement_followup_tasks.md"},{"id":"W047","title":"Web — Thread Detail","platform":"web","module":"M12","route":"/inbox/[id]","purpose":"Full-page thread view — an alternative to the split-pane inbox for deep-link access and focused conversations. Shows the complete message history with AI intent classification and suggested replies.","sections":["Purpose & Context","Layout Structure","Component Hierarchy","4-5. Data & Actions","States","Real-time Updates","Error Handling"],"kind":"detail","source":"docs/03_screens/web/screen_web_engagement_thread_detail.md"},{"id":"W046","title":"Web — Unified Inbox","platform":"web","module":"M12","route":"/inbox","purpose":"The Unified Inbox aggregates comments, DMs, and mentions from all connected platforms (TikTok, Instagram, YouTube, Shopee, Facebook) into a single split-pane interface. AI-powered intent detection classifies each message (purchase inquiry, praise, criticism, complaint, question, spam), aut","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Displayed Data","User Actions","Validation Rules"],"kind":"table","source":"docs/03_screens/web/screen_web_engagement_unified_inbox.md"},{"id":"W083","title":"Web — Finance: Cost Detail","platform":"web","module":"M19","route":"/finance/costs","purpose":"Cost breakdown by category — platform fees, AI credits, advertising, shipping, COGS, and custom costs. Period trends with optimization hints from the AI Copilot. This is the cost truth layer: every cost is categorized, source-attributed, and deducted from revenue in Profit OS.","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Displayed Data","User Actions","Validation Rules (Add/Edit Custom Cost)"],"kind":"analytics","source":"docs/03_screens/web/screen_web_finance_costs.md"},{"id":"W080","title":"Web — Finance: Profit Dashboard","platform":"web","module":"M19","route":"/finance","purpose":"Main finance dashboard — net profit overview with trust annotations, revenue vs cost trend, margin health tracking, and quick links to detailed breakdowns. The command center for financial health.","sections":["Purpose & Context","Screen Layout","Component Hierarchy","States","Permissions","Edge Cases","Error Handling"],"kind":"analytics","source":"docs/03_screens/web/screen_web_finance_dashboard.md"},{"id":"W081","title":"Web — Profit Dashboard","platform":"web","module":"M19","route":"/finance","purpose":"The Profit Dashboard is the financial cockpit of Creativanta — showing real net profit (revenue minus all costs), revenue breakdown by platform/product, cost tracking by category, reconciliation status per platform, and proof audit trail. Every financial number is traceable to its source v","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Displayed Data","User Actions","Validation Rules"],"kind":"analytics","source":"docs/03_screens/web/screen_web_finance_profit_dashboard.md"},{"id":"W085","title":"Web — Proof Browser","platform":"web","module":"M19","route":"/finance/proof","purpose":"Browse and verify proof bundles — evidence objects that support financial claims. This is the trust accountability layer of Profit OS: every financial number (revenue, cost, profit) must trace back to proof items. Proof bundles group evidence by period and claim type, showing coverage gaps","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Displayed Data","User Actions","States"],"kind":"analytics","source":"docs/03_screens/web/screen_web_finance_proof.md"},{"id":"W084","title":"Web — Reconciliation Center","platform":"web","module":"M19","route":"/finance/reconciliation","purpose":"Reconcile financial data across platforms — match orders ↔ settlements ↔ payouts automatically, then surface anomalies and conflicts for human review. This is the \"trust audit\" layer: every VND of revenue must trace to a settlement, and every settlement must trace to real orders.","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Displayed Data","User Actions","States"],"kind":"analytics","source":"docs/03_screens/web/screen_web_finance_reconciliation.md"},{"id":"W087","title":"Web — Financial Reports","platform":"web","module":"M19","route":"/profit/reports","purpose":"Generate P&L statements, cash flow summaries, and custom financial reports with trust annotations (source class badges) and multi-format export (CSV, PDF, Google Sheets).","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Report Templates","States","Permissions"],"kind":"analytics","source":"docs/03_screens/web/screen_web_finance_reports.md"},{"id":"W082","title":"Web — Finance: Revenue Detail","platform":"web","module":"M19","route":"/finance/revenue","purpose":"Revenue breakdown by source, platform, product, and content — with period comparison, trend analysis, source class transparency, and export capability. This is the \"revenue truth\" screen where every VND is attributed and source-classified per PRD §33 operating ledger requirements.","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Displayed Data","User Actions","States"],"kind":"analytics","source":"docs/03_screens/web/screen_web_finance_revenue.md"},{"id":"W086","title":"Web — Settlement Tracker","platform":"web","module":"M19","route":"/finance/settlements","purpose":"Track platform payouts/settlements — match settlements to orders, verify bank deposit references, and resolve amount mismatches. Settlements are the \"proof of payment\" from platforms: they confirm how much money was actually transferred to the creator's bank account.","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","User Actions","States","Permissions"],"kind":"analytics","source":"docs/03_screens/web/screen_web_finance_settlements.md"},{"id":"W008","title":"Web — Copilot Dialog","platform":"web","module":"copilot","route":"","purpose":"The AI Copilot is a conversational AI assistant that slides in from the right side of any page. It can answer questions about the workspace data, suggest actions, generate content, and help with decision-making. Context-aware: it knows what page the user is on and can reference visible dat","sections":["Purpose & Context","Layout Structure","Component Hierarchy","4-5. Data & Actions","6-20. Standard Sections","P ","title":"Web — Notification Center","platform":"web","module":"M01","route":"/notifications","purpose":"The Notification Center aggregates all system notifications — from new orders, publishing events, AI results, team mentions, and platform alerts. It has two modes: a dropdown (bell icon in topbar) for quick glance, and a full page for browsing history.","sections":["Purpose & Context","Layout Structure","Component Hierarchy","Data Binding & Display Format","Actions Table","State Machine","7-8. Validation & Permission"],"kind":"dashboard","source":"docs/03_screens/web/screen_web_home_notification_center.md"},{"id":"W006","title":"Web — Onboarding Setup","platform":"web","module":"M01","route":"/onboarding","purpose":"Multi-step onboarding wizard activated after first workspace creation. Guides new users through: profile setup → connect platforms → set preferences → choose operator mode → complete. Each step is skippable but encouraged.","sections":["Purpose & Context","Layout Structure","Component Hierarchy","4-5. Data & Actions","6-20. Standard Sections","Error Handling","Accessibility"],"kind":"form","source":"docs/03_screens/web/screen_web_home_onboarding.md"},{"id":"W005","title":"Web — Quick Action Menu","platform":"web","module":"M01","route":"","purpose":"The Quick Action Menu is a floating action button (FAB) permanently anchored to the bottom-right of every app page. When activated, it expands into a radial or stacked menu offering one-tap access to the most frequent creation actions across all modules. This eliminates the need to navigat","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Displayed Data / Data Binding","User Actions","States / State Machine"],"kind":"dashboard","source":"docs/03_screens/web/screen_web_home_quick_actions.md"},{"id":"W007","title":"Web — Settings Page","platform":"web","module":"M01","route":"/settings","purpose":"Settings hub — the navigation page for all workspace and nce_opportunity_detail.md"},{"id":"W039","title":"Web — Trend Detail","platform":"web","module":"M02","route":"/intelligence/trends/[id]","purpose":"Deep-dive into a single trend — showing its trajectory over time, related content, top-performing examples, audience overlap scores, and one-click conversion to ideas/scripts. This is the \"intelligence brief\" for a trend.","sections":["Purpose & Context","Layout Structure","Component Hierarchy","Data Binding & Display Format","Actions Table","State Machine","Validation Rules"],"kind":"detail","source":"docs/03_screens/web/screen_web_intelligence_trend_detail.md"},{"id":"W038","title":"Web — Trend Radar","platform":"web","module":"M02","route":"/intelligence/trends","purpose":"The Trend Radar is the intelligence engine's primary discovery interface — a real-time \"content weather map\" showing what's trending across connected platforms (TikTok, YouTube, Shopee, Google Trends, Instagram). The screen combines AI-powered scoring, multi-axis filtering, sparkline visua","sections":["Purpose & Context","Preconditions / Postconditions","Screen Layout","Component Hierarchy","Displayed Data / Data Binding","User Actions","States / State Machine"],"kind":"dashboard","source":"docs/03_screens/web/screen_web_intelligence_trend_radar.md"},{"id":"W042","title":"Web — Watchlist Manager","platform":"web","module":"M02","route":"/intelligence/watchlist","purpose":"Watchlists allow creators to organize and track trends they're interested in. Users can create multiple named watchlists (e.g., \"Beauty Trends\", \"Food Content Ideas\") and receive notifications when watched trends change significantly.","sections":["Purpose & Context","Layout Structure","Component Hierarchy","Data Binding & Display Format","Actions Table","State Machine","Validation Rules"],"kind":"table","source":"docs/03_screens/web/screen_web_intelligence_watchlist.md"},{"id":"W107","title":"Web — Live Session Planner","platform":"web","module":"M17","route":"/live/plan function navigate(id){

 renderShell();window.scrollTo({top:0,behavior:'instant'});
 document.querySelector('.content')?.scrollTo(0,0);
 document.getElementById('overlay-root').innerHTML='';
}

function onAction(action,target){
 if(action==='menu'){state.mobileMenu=!state.mobileMenu;document.body.classList.toggle('nav-open',state.mobileMenu);return}
 if(action==='close-menu'){state.mobileMenu=false;document.body.classList.remove('nav-open');return}
 if(action==='search'){openSearch();return}
 if(action==='close-overlay'){document.getElementById('overlay-root').innerHTML='';return}
 if(action==='create'){openDialog('create');return}
 if(action==='workspace'){openDialog('workspace');return}
 if(action==='notifications'){openDialog('notification');return}
 if(action==='help'){openDialog('help');return}
 if(action==='save-idea'){
  const title=document.getElementById('new-idea')?.value.trim();
  if(!title){document.getElementById('new-idea')?.focus();showToast('Nhập tên ý tưởng để lưu');return}
  state.ideas.unshift({title,id:Date.now()});
  document.getElementById('overlay-root').innerHTML='';
  navigate(SURFACE==='mobile'?'M008':'W012');showToast('Đã thêm vào bảng ý tưởng demo');return
 }
 if(action==='task'){
  const key=target.dataset.key;state.taskDone.has(key)?state.taskDone.delete(key):state.taskDone.add(key);
  render();return
 }
 if(action==='thread'){state.inbox=Number(target.dataset.index)||0;render();return}
 if(action==='send'){
  const input=document.getElementById('message-draft');
  if(!input?.value.trim()){input?.focus();return}
  showToast('Tin nhắn chỉ được mô phỏng, chưa gửi đến khách hàng');input.value='';return
 }
 if(action==='filter'){state.filters[group().id]=target.dataset.filter||'all';render();return}
 if(action==='demo'){openDialog('generic');return}
 if(action==='back'){history.back();return}
}
document.addEventListener('click',e=>{
 const target=e.target.closest('[data-go],[data-group],[data-act]');
 if(!target)return;
 if(target.dataset.go){navigate(target.dataset.go);return}
 if(target.dataset.group){const g=NAV.find(x=>x.id===target.dataset.group);if(g)navigate(g.ids.find(id=>BY_ID.has(id))||ROOT_ID);return}
 const act=target.dataset.act;if(act)onAction(act,target);
});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}
 if(e.key==='Escape'){document.getElementById('overlay-root').innerHTML='';state.mobileMenu=false;document.body.classList.remove('nav-open');return}
 if(e.key==='Enter'){
  const a=e.target.closest('[data-go][role="button"]');
  if(a)navigate(a.dataset.go);
  const palette=document.getElementById('palette-input');
  if(document.activeElement===palette){const first=document.querySelector('.palette-result');if(first)navigate(first.dataset.go)}
 }
});
window.addEventListener('popstate',()=>{const hash=decodeURIComponent(location.hash.slice(1));if(BY_ID.has(hash)){state.id=hash;render()}});
window.addEventListener('hashchange',()=>{const hash=decodeURIComponent(location.hash.slice(1));if(BY_ID.has(hash)&&hash!==state.id){state.id=hash;render()}});

  document.getElementById('v5-modal-title')?.focus();return;
 }
 if(source==='add-record'){
  const title=document.getElementById('v5-modal-title')?.value.trim();
  if(!title){v5Toast('Vui lòng nhập tên bản ghi');document.getElementById('v5-modal-title')?.focus();return}
  (V5.extra[id]??=[]).unshift({name:title,owner:'Bạn (DEMO)',tag:'Mới tạo',value:'0đ',id:Date.now()});
  document.getElementById('overlay-root').innerHTML='';v5Refresh();v5Toast('Đã thêm bản ghi demo');return;
 }
 if(source==='close-modal'){document.getElementById('overlay-root').innerHTML='';return}
 if(source==='close-modal-backdrop'){if(el===window.event?.target)document.getElementById('overlay-root').innerHTML='';return}
 if(source==='period'){V5.period[id]=el.dataset.v5Key;v5Refresh();return}
 if(source==='sort'){V5.sort[id]=!V5.sort[id];v5Refresh();return}
 if(source==='filter'){V5.sort[id]=!V5.sort[id];v5Refresh();v5Toast('Đã thay đổi bộ lọc mô phỏng');return}
 if(source==='record'||source==='preview'){
  const item=v5FilteredRecords(s)[idx]||v5Records(s)[0];
  v5Modal(source==='preview'?'Xem trước bản nháp':'Chi tiết · '+(item?.name||s.title),
   '<p>'+v5Text(s.category)+' · Thông tin minh họa, không có dữ liệu khách hàng thật.</p>'+
   '<div class="v5-inspector"><strong>Đối tượng đang xem</strong>'+v5Text(item?.name||s.title)+'<br>Trạng thái: '+v5Text(v5Status(s,idx))+'<br>Người phụ trách: '+v5Text(item?.owner||'Creator Studio')+'</div>',
   '<button class="btn" data-v5="close-modal">Đóng</button><button class="btn accent" data-v5="edit" data-v5-id="'+id+'">Chỉnh sửa demo</button>');return;
 }
 if(source==='toggle'){let key=id+'-setting-'+idx;V5.statuses[key]=V5.statuses[key]==='Đang tắt'?'Đang bật':'Đang tắt';v5Refresh();return}
 if(source==='thread'){V5.selected[id]=new Set([idx]);v5Refresh();return}
 if(source==='select-row'){
   let sel=V5.selected[id]??new Set();if(el.checked)sel.add(idx);else sel.delete(idx);V5.selected[id]=sel;return;
 }
 if(source==='select-all'){V5.selected[id]=el.checked?new Set(v5FilteredRecords(s).map((_,i)=>i)):new Set();v5Refresh();return}
 if(source==='export'){
  const records=v5Records(s),lines=[['Mục','Người phụ trách','Trạng thái','Giá trị DEMO'],...records.map((x,i)=>[x.name,x.owner,v5Status(s,i),x.value])];
  const csv='\uFEFF'+lines.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='creativanta-demo-'+id+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),400);
  v5Toast('Đã xuất CSV dữ liệu minh họa');return;
 }
 if(source==='decision'||source==='reject'||source==='source-action'){
  const item=source==='source-action'?s.sourceActions[idx]:null;
  if(item && item.type==='export')return v5Action('export',el);
  if(item && item.type==='navigation'){
    const next=(s.related||[]).find(x=>V5_BY_ID.has(x));
    document.getElementById('overlay-root').innerHTML='';
    if(next)navigate(next);else v5Action('record',el);return;
  }
  if(item && item.type==='filter')return v5Action('filter',el);
  if(item && item.type==='upload')return v5Action('upload',el);
  if(item && item.type==='mutate'&&!/delete|remove|suspend|approve|publish/i.test(item.sourceName))return v5Action('create',el);
  const actionName=item?.label || (source==='reject'?'Chuyển xử lý':'Phê duyệt');
  V5.pending={id,idx,actionName};
  v5Modal('Xác nhận thao tác','<p><strong>'+v5Text(actionName)+'</strong> có thể thay đổi trạng thái nghiệp vụ. Trong prototype, thay đổi chỉ là mô phỏng, không gửi API.</p>'+
   '<div class="v5-notice warning">'+ic('shield',16)+' Bản DEMO không thực hiện thay đổi dữ liệu thật.</div>',
   '<button class="btn" data-v5="close-modal">Hủy</button><button class="btn accent" data-v5="confirm-decision" data-v5-id="'+id+'">Xác nhận DEMO</button>');
  return;
 }
 if(source==='confirm-decision'){
  if(V5.pending){V5.statuses[V5.pending.id+'-'+V5.pending.idx]='Đã xác nhận DEMO';}
  V5.pending=null;document.getElementById('overlay-root').innerHTML='';v5Refresh();v5Toast('Đã ghi nhận quyết định trong bộ nhớ demo');return;
 }
 if(source==='actions'){
  const arr=s.sourceActions||[];
  v5Modal('Thao tác · '+s.title,'<p>Các thao tác mô phỏng theo đặc tả nghiệp vụ.</p>'+
   (arr.length?arr.map((a,i)=>'<button class="v5-toolbtn" style="width:100%;justify-content:space-between;margin:6px 0" data-v5="source-action" data-v5-id="'+id+'" data-v5-key="'+i+'">'+v5Text(a.label)+' '+ic('right',14)+'</button>').join(''):
   '<div class="v5-inspector">Màn hình dùng các thao tác chung: xem, lọc, tạo và quản lý bản nháp.</div>'),
   '<button class="btn" data-v5="close-modal">Đóng</button>');return;
 }
 if(source==='upload'){
  v5Modal('Chọn tệp / hóa đơn','<p>Thiết kế minh họa cho quá trình đính kèm. Không có dữ liệu nào được tải lên máy chủ.</p>'+
   '<input type="file" id="v5-demo-upload" class="v5-input" accept="image/*,.pdf,.csv"/>',
   '<button class="btn" data-v5="close-modal">Hủy</button><button class="btn accent" data-v5="confirm-upload" data-v5-id="'+id+'">Gắn vào bản nháp</button>');return;
 }
 if(source==='confirm-upload'){
  const name=document.getElementById('v5-demo-upload')?.files?.[0]?.name||'Tệp mẫu';
  document.getElementById('overlay-root').innerHTML='';v5Toast('Đã chọn '+name+' (DEMO)');return;
 }
 if(source==='send'||source==='run'){
  const txt=document.querySelector('[data-v5-compose="'+id+'"]')?.value.trim();
  v5Modal(source==='send'?'Gửi phản hồi demo':'Chạy quy trình demo',
   '<p>'+(source==='send'?'Nội dung soạn: '+v5Text(txt||'Chưa nhập nội dung'):'Quy trình được mô phỏng cục bộ, không kích hoạt tác vụ thật.')+'</p>',
   '<button class="btn" data-v5="close-modal">Hủy</button><button class="btn accent" data-v5="confirm-decision" data-v5-id="'+id+'">Chạy mô phỏng</button>');
  V5.pending={id,idx:0,actionName:'Thao tác demo'};return;
 }
 if(source==='auth'){
  const email=document.getElementById('v5-auth-email')?.value||'';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){v5Toast('Vui lòng nhập email hợp lệ');return}
  v5Toast('Đã kiểm tra biểu mẫu DEMO — không đăng nhập thật');return;
 }
 if(source==='save'){
  const data={};
  document.querySelectorAll('[data-v5-input^="'+id+'-"]').forEach((e,i)=>data[i]=e.value);
  V5.forms[id]=data;v5Toast('Đã lưu thay đổi trong phiên DEMO');return;
 }
 v5Toast('Thao tác chỉ được mô phỏng trong prototype');
}
document.addEventListener('click',function v5OnClick(event){
 const el=event.target.closest('[data-v5]');
 if(!el)return;
 event.preventDefault();
 if(el.dataset.v5==='close-modal-backdrop'&&event.target!==el)return;
 v5Action(el.dataset.v5,el);
});
document.addEventListener('input',function v5OnInput(event){
 const el=event.target;
 if(el.dataset.v5Search){
  const sid=el.dataset.v5Search;const text=el.value;V5.query[sid]=text;
  const s=v5Src(sid);if(!s)return;
  const wrapper=document.querySelector('.v5-screen');
  if(!wrapper)return;
  const oldScroll=window.scrollY;
  renderShell();window.scrollTo({top:oldScroll,behavior:'instant'});
  const input=document.querySelector('[data-v5-search="'+sid+'"]');input?.focus();
  input?.setSelectionRange(text.length,text.length);
 }
});

window.__cv5QA=(id)=>navigate(id);

})();
</script>
</body></html>
