// ============================================================================
// AI Remix & Multi-Merge Messages (P4-04 Deliverable)
// ============================================================================

// CreativeDna holds 8-layer video analysis output per Mode 4 (ai_video_studio.md §Mode 4).
message CreativeDna {
  int32 scene_count = 1;
  string hook_type = 2; // Question, Shock, Story, Listicle, Contrast, POV
  string content_structure_json = 3; // e.g. [{"name":"Hook","duration_s":3}, ...]
  string pacing_profile_json = 4; // Fast -> Medium -> Fast
  string visual_style_json = 5; // Bright palette, fast cuts, text overlays
  string audio_profile_json = 6; // Pop, BPM 120, Voice 70% / Music 30%
  string transition_map_json = 7;
  double total_duration_seconds = 8;
  string engagement_structure_json = 9;
}

// RemixBlueprint represents durable Creative DNA blueprint per database_schema.md §22.2.
message RemixBlueprint {
  string blueprint_id = 1;
  string workspace_id = 2;
  string reference_asset_id = 3;
  string reference_url = 4;
  string output_asset_id = 5;
  string video_edit_job_id = 6;
  CreativeDna creative_dna = 7;
  string remix_script = 8;
  FidelityLevel fidelity_level = 9;
  double originality_score = 10; // 0-100 score (>70 required)
  double similarity_percentage = 11; // Script similarity (<30% required per RULE-M07-003)
  RemixStatus status = 12;
  string rejection_reason = 13;
  string error_message = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  string trend_id = 17;
}

// OriginalityCheckResult enforces canonical RULE-M07-003 similarity check (<30% threshold).
message OriginalityCheckResult {
  double similarity_percentage = 1; // Evaluated similarity vs reference transcript
  double canonical_threshold_percentage = 2; // 30.0%
  double originality_score = 3; // (100 - similarity_percentage)
  bool passed = 4; // True if similarity < 30.0%
  string explanation = 5; // e.g. "Output too similar to reference (35% similarity, max 30%)"
  repeated string actionable_alternatives = 6; // ["Adjust to 'Loose Inspiration' fidelity", "Edit script manually"]
}

// CopyrightCheckResult models media copyright scanning and no-unlicensed-bypass rule.
message CopyrightCheckResult {
  string media_id = 1;
  string media_title = 2;
  bool is_copyrighted = 3;
  string detected_song_title = 4;
  string detected_artist = 5;
  bool license_verified = 6;
  string license_key = 7;
  bool passed = 8; // True if not copyrighted or license_verified
  bool can_bypass_risk = 9; // Strictly false for confirmed infringements per SAFE-2026-02
  string warning_message = 10;
  repeated string actionable_options = 11; // ["Replace with licensed audio", "Submit license for review"]
}

// MultiMergeTimelineItem represents an individual track element in Mode 3 Multi-Merge.
message MultiMergeTimelineItem {
  string item_id = 1;
  string asset_id = 2;
  int32 order_index = 3;
  double duration_seconds = 4;
  string media_type = 5; // video, image
  string transition_to_next = 6; // ken_burns, crossfade, fade_in, cut, zoom, glitch
  double transition_duration_seconds = 7;
  string license_status = 8; // licensed, royalty_free, copyrighted_unverified, copyrighted_verified
  string license_proof_key = 9;
}

// MultiMergeSettings configures overall timeline assembly per Mode 3 (ai_video_studio.md §Mode 3).
message MultiMergeSettings {
  double target_duration_seconds = 1;
  bool auto_transitions = 2;
  string voice_over_type = 3; // none, character_tts, upload, record
  string voice_over_character_id = 4;
  string music_source = 5; // none, ai_select, library, upload
  string music_asset_id = 6;
  string music_license_proof = 7;
  string aspect_ratio = 8; // 9:16, 16:9, 1:1
  string pacing = 9; // fast, medium, slow
}

// VideoEditJob represents a video edit job record per database_schema.md §22.1.
message VideoEditJob {
  string job_id = 1;
  string workspace_id = 2;
  ProductionMode mode = 3;
  repeated string source_asset_ids = 4;
  repeated string output_asset_ids = 5;
  string generation_job_id = 6;
  string character_id = 7;
  string brand_pack_id = 8;
  VideoEditJobStatus status = 9;
  string input_params_json = 10;
  string output_metadata_json = 11;
  string credits_estimated = 12;
  string credits_used = 13;
  string actual_cost_usd = 14;
  string error_message = 15;
  google.protobuf.Timestamp started_at = 16;
  google.protobuf.Timestamp completed_at = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

