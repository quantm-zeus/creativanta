// ============================================================================
// AssetService Request / Response Messages
// ============================================================================

message BatchGenerationItem {
  string item_id = 1;
  string item_name = 2;
  string prompt = 3;
  string reference_url = 4;
  repeated string image_urls = 5;
}

message GenerateRequest {
  creativanta.common.v1.CommandContext context = 1;
  string title = 2;
  ProductionMode mode = 3;
  string prompt = 4;
  string script_id = 5;
  string asset_brief_id = 6;
  repeated string continuity_pack_ids = 7;
  PipelineStrategy pipeline_strategy = 8;
  string preferred_provider = 9;
  string preferred_model = 10;
  PostProductionConfig post_production = 11;
  string byok_api_key = 12; // Optional BYOK key
  string quote_id = 13; // Bounded quote ID from preflight
  string confirmed_credits = 14; // Must match quoted credits
  bool dry_run = 15; // Set true for budget preview & partial batch validation
  repeated BatchGenerationItem batch_items = 16; // For batch generation
