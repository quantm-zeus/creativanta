// ============================================================================
// Additional Service Declarations (§7.1, §7.2)
// ============================================================================

// RemixService implements Phase 1-3 AI Remix Studio pipeline (api_endpoint_map.md §7.2).
service RemixService {
  // Analyze extracts Creative DNA from reference video (Phase 1).
  rpc Analyze(RemixServiceAnalyzeRequest) returns (RemixServiceAnalyzeResponse);

  // GetBlueprint retrieves Creative DNA blueprint and editable script.
  rpc GetBlueprint(RemixServiceGetBlueprintRequest) returns (RemixServiceGetBlueprintResponse);

  // Generate recreates original remix with strict originality check (<30% similarity).
  rpc Generate(RemixServiceGenerateRequest) returns (RemixServiceGenerateResponse);

  // Regenerate adjusts an individual scene or regenerated output.
  rpc Regenerate(RemixServiceRegenerateRequest) returns (RemixServiceRegenerateResponse);
}

// VideoEditJobService manages production editing jobs including Multi-Merge (api_endpoint_map.md §7.1).
service VideoEditJobService {
  // Create starts a new production job (e.g. multi_merge, quick_edit).
  rpc Create(VideoEditJobServiceCreateRequest) returns (VideoEditJobServiceCreateResponse);

  // Get retrieves job status and metadata.
  rpc Get(VideoEditJobServiceGetRequest) returns (VideoEditJobServiceGetResponse);

  // List returns filtered production jobs for a workspace.
  rpc List(VideoEditJobServiceListRequest) returns (VideoEditJobServiceListResponse);

  // Cancel cancels an in-flight video edit job and refunds unspent credits.
  rpc Cancel(VideoEditJobServiceCancelRequest) returns (VideoEditJobServiceCancelResponse);

  // Retry retries a failed video edit job.
  rpc Retry(VideoEditJobServiceRetryRequest) returns (VideoEditJobServiceRetryResponse);
}

