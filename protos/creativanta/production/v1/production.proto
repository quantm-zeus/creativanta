message GetStatusRequest {
  creativanta.common.v1.UUID workspace_id = 1;
  string job_id = 2;
}

message GetStatusResponse {
  GenerationJob job = 1;
  Asset asset = 2;
}

message ListRequest {
  creativanta.common.v1.UUID workspace_id = 1;
  string asset_type = 2;
  string generation_state = 3;
  string quality_state = 4;
  creativanta.common.v1.Pagination pagination = 5;
}

message ListResponse {
  repeated Asset assets = 1;
  creativanta.common.v1.PaginatedResponse pagination = 2;
}

message GetRequest {
  creativanta.common.v1.UUID workspace_id = 1;
  string asset_id = 2;
}

message GetResponse {
  Asset asset = 1;
}

message ApproveRequest {
  creativanta.common.v1.CommandContext context = 1;
  string asset_id = 2;
  string feedback_notes = 3;
}

message ApproveResponse {
  Asset asset = 1;
}

message PromoteCanonicalRequest {
  creativanta.common.v1.CommandContext context = 1;
  string asset_id = 2;
  string pack_id = 3;
}

message PromoteCanonicalResponse {
  Asset asset = 1;
  string canonical_pack_id = 2;
}

message UploadRequest {
  creativanta.common.v1.CommandContext context = 1;
  string file_name = 2;
  string mime_type = 3;
  int64 file_size_bytes = 4;
  bytes file_content = 5;
  string upload_purpose = 6; // asset, avatar, brand_logo, evidence
}

message UploadResponse {
  string upload_id = 1;
  string storage_url = 2;
  string virus_scan_status = 3;
  Asset asset = 4;
}

// ============================================================================
// Service Declarations
// ============================================================================

// StudioService manages studio modes, monitoring, and job queues.
service StudioService {
  // GetModes returns the list of available studio modes and current pricing/limits.
  rpc GetModes(GetModesRequest) returns (GetModesResponse);

  // GetActiveJobs returns active processing and queued generation jobs.
  rpc GetActiveJobs(GetActiveJobsRequest) returns (GetActiveJobsResponse);

  // GetRecentAssets returns the most recent outputs for the studio launcher.
  rpc GetRecentAssets(GetRecentAssetsRequest) returns (GetRecentAssetsResponse);

  // Cancel cancels an in-flight or queued job and handles credit reconciliation/refund.
  rpc Cancel(CancelRequest) returns (CancelResponse);

  // Retry retries a failed generation job, optionally switching to a fallback provider.
  rpc Retry(RetryRequest) returns (RetryResponse);
}

// AssetService manages generation, lifecycle, approval, and promotion of assets.
service AssetService {
  // Generate initiates AI generation or executes preflight budget preview (dry_run).
  rpc Generate(GenerateRequest) returns (GenerateResponse);

  // GetStatus polls current job execution and aggregate asset state.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // List returns workspace assets filtered by state or type.
  rpc List(ListRequest) returns (ListResponse);

  // Get retrieves a single asset with full lineage metadata.
  rpc Get(GetRequest) returns (GetResponse);

  // Approve marks an asset approved (Manager+).
  rpc Approve(ApproveRequest) returns (ApproveResponse);

  // PromoteCanonical promotes an approved asset to canonical character/brand pack (Manager+).
  rpc PromoteCanonical(PromoteCanonicalRequest) returns (PromoteCanonicalResponse);

  // Upload uploads a source asset safely with MIME and virus scan checks.
  rpc Upload(UploadRequest) returns (UploadResponse);

  // EvaluateDrift evaluates asset drift against canonical references and blocks high drift (QA).
  rpc EvaluateDrift(EvaluateDriftRequest) returns (EvaluateDriftResponse);

  // OverrideDriftViolation resolves a blocking drift violation with manager justification.
  rpc OverrideDriftViolation(OverrideDriftViolationRequest) returns (OverrideDriftViolationResponse);
}

// ============================================================================
// Quick Edit Data Types & Services (M07 Mode 1)
// ============================================================================

enum TranscriptAlignmentStatus {
  TRANSCRIPT_ALIGNMENT_STATUS_UNSPECIFIED = 0;
  TRANSCRIPT_ALIGNMENT_STATUS_AUTO_ALIGNED = 1;
  TRANSCRIPT_ALIGNMENT_STATUS_REPAIRED = 2;
  TRANSCRIPT_ALIGNMENT_STATUS_MANUAL_FALLBACK = 3;
  TRANSCRIPT_ALIGNMENT_STATUS_FAILED = 4;
}

message TranscriptWord {
  string word_id = 1;
  string text = 2;
  int64 start_ms = 3;
  int64 end_ms = 4;
  double confidence = 5;
  bool is_filler = 6;
  string filler_type = 7;
  bool is_deleted = 8;
}

message TranscriptSegment {
  string segment_id = 1;
  int64 start_ms = 2;
  int64 end_ms = 3;
  string text = 4;
  string speaker_id = 5;
}

message Transcript {
  string transcript_id = 1;
  creativanta.common.v1.UUID workspace_id = 2;
  string asset_id = 3;
  string language = 4;
  string raw_text = 5;
  repeated TranscriptWord words = 6;
  repeated TranscriptSegment segments = 7;
  int32 filler_count = 8;
  int32 pause_count = 9;
  TranscriptAlignmentStatus alignment_status = 10;
  string alignment_error = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message DeadPause {
  int64 start_ms = 1;
  int64 end_ms = 2;
  int64 duration_ms = 3;
}

message TranscriptAnalysis {
  int32 filler_count = 1;
  int32 pause_count = 2;
  double hook_quality_score = 3;
  int64 estimated_time_saved_ms = 4;
  int64 final_duration_ms = 5;
  repeated string detected_fillers = 6;
  repeated DeadPause dead_pauses = 7;
  string hook_feedback = 8;
}

message TranscriptCorrection {
  string word_id = 1;
  string corrected_text = 2;
  int64 new_start_ms = 3;
  int64 new_end_ms = 4;
  bool mark_cut = 5;
}

message CutInterval {
  int64 start_ms = 1;
  int64 end_ms = 2;
  string reason = 3;
}

message QuickEditAddons {
  bool auto_captions = 1;
  string caption_style = 2;
  bool add_hook = 3;
  string hook_id = 4;
  string hook_type = 5;
  bool beat_sync = 6;
  string sound_id = 7;
  bool b_roll = 8;
  string b_roll_scene = 9;
  string platform_preset = 10;
  bool audio_enhancement = 11;
  double target_lufs = 12;
  string reframe_ratio = 13;
}

message QuickEditPlan {
  string asset_id = 1;
  string transcript_id = 2;
  repeated CutInterval cuts = 3;
  QuickEditAddons addons = 4;
  string estimated_credits = 5;
  string balance_after_credits = 6;
}

message QuickEditDraft {
  string draft_id = 1;
  creativanta.common.v1.UUID workspace_id = 2;
  string asset_id = 3;
  string transcript_id = 4;
  string name = 5;
  repeated CutInterval cuts = 6;
  QuickEditAddons addons = 7;
  string estimated_credits = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message QuickEditServiceSaveDraftRequest {
  creativanta.common.v1.CommandContext context = 1;
  string draft_id = 2;
  string asset_id = 3;
  string transcript_id = 4;
  string name = 5;
  repeated CutInterval cuts = 6;
  QuickEditAddons addons = 7;
  string estimated_credits = 8;
}

message QuickEditServiceSaveDraftResponse {
  QuickEditDraft draft = 1;
}

message BeatSyncGrid {
  int32 bpm = 1;
  repeated int64 beat_timestamps_ms = 2;
  repeated int64 downbeat_timestamps_ms = 3;
  double confidence = 4;
}

// QuickEditService manages Quick Edit drafts and text-based timeline editing.
service QuickEditService {
  // SaveDraft persists an in-progress quick edit draft.
  rpc SaveDraft(QuickEditServiceSaveDraftRequest) returns (QuickEditServiceSaveDraftResponse);
}


// ============================================================================
// Translation & Localization Messages (M07 EF-05)
// ============================================================================

// TranslationJob represents a multi-language localization job per database_schema.md §22.6.
message TranslationJob {
  string translation_job_id = 1;
  string workspace_id = 2;
  string video_edit_job_id = 3;
  string source_asset_id = 4;
  repeated string target_languages = 5;
  bool lip_sync_enabled = 6;
  bool cultural_adaptation_enabled = 7;
  bool translate_captions = 8;
  bool translate_overlays = 9;
  string voice_option = 10;
  string voice_clone_id = 11;
  map<string, string> per_language_status = 12;
  map<string, string> output_asset_ids = 13;
  string total_credits_used = 14;
  string status = 15;
  map<string, double> quality_scores = 16;
  map<string, string> repair_notes = 17;
  string quote_id = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}

// TranslationSegment represents a timecoded speech segment with quality scoring and repair state.
message TranslationSegment {
  string segment_id = 1;
  double start_time_s = 2;
  double end_time_s = 3;
  string source_text = 4;
  map<string, string> translations = 5;
  double quality_score = 6;
  bool needs_repair = 7;
  string repair_reason = 8;
}

message TranslationServiceCreateRequest {
  creativanta.common.v1.CommandContext context = 1;
  string source_asset_id = 2;
  repeated string target_languages = 3;
  bool lip_sync_enabled = 4;
  bool cultural_adaptation_enabled = 5;
  bool translate_captions = 6;
  bool translate_overlays = 7;
  string voice_option = 8;
  string voice_clone_id = 9;
  string quote_id = 10;
  string confirmed_credits = 11;
  map<string, string> custom_script_corrections = 12;
}

message TranslationServiceCreateResponse {
  TranslationJob job = 1;
  string credits_reserved = 2;
  double discount_applied_pct = 3;
}

message TranslationServiceGetRequest {
  creativanta.common.v1.UUID workspace_id = 1;
  string translation_job_id = 2;
}

message TranslationServiceGetResponse {
  TranslationJob job = 1;
  repeated Asset output_assets = 2;
  repeated TranslationSegment segments = 3;
}

message TranslationServiceListRequest {
  creativanta.common.v1.UUID workspace_id = 1;
  creativanta.common.v1.Pagination pagination = 2;
}

message TranslationServiceListResponse {
  repeated TranslationJob jobs = 1;
  creativanta.common.v1.PaginatedResponse pagination = 2;
}

// TranslationService manages AI video translation, lip-sync, cultural adaptation and localization (M07 EF-05).
service TranslationService {
  rpc Create(TranslationServiceCreateRequest) returns (TranslationServiceCreateResponse);
  rpc Get(TranslationServiceGetRequest) returns (TranslationServiceGetResponse);
  rpc List(TranslationServiceListRequest) returns (TranslationServiceListResponse);
}

// ============================================================================
// Sound Studio Messages (M07 EF-06)
// ============================================================================

// SoundTrack represents an audio or sound design asset with verified licensing metadata.
message SoundTrack {
  string track_id = 1;
  string workspace_id = 2;
  string title = 3;
  string category = 4; // music, sfx, ambient
  string genre = 5;
  string mood = 6;
  int32 bpm = 7;
  double duration_seconds = 8;
  string file_url = 9;
  string license_type = 10; // commercial_royalty_free, licensed_library, user_uploaded
  string license_id = 11;
  bool is_verified_license = 12;
  repeated float waveform_peaks = 13;
  google.protobuf.Timestamp created_at = 14;
}

message SoundStudioServiceGenerateMusicRequest {
  creativanta.common.v1.CommandContext context = 1;
  string prompt = 2;
  string genre = 3;
  string mood = 4;
  int32 bpm = 5;
  int32 duration_seconds = 6;
  string license_type = 7;
  string quote_id = 8;
  string confirmed_credits = 9;
}

message SoundStudioServiceGenerateMusicResponse {
  SoundTrack track = 1;
  Asset asset = 2;
  string credits_deducted = 3;
}

message SoundStudioServiceGenerateSFXRequest {
  creativanta.common.v1.CommandContext context = 1;
  string prompt = 2;
  string category = 3;
  double duration_seconds = 4;
  string quote_id = 5;
  string confirmed_credits = 6;
}

message SoundStudioServiceGenerateSFXResponse {
  SoundTrack track = 1;
  Asset asset = 2;
  string credits_deducted = 3;
}

message SoundStudioServiceAnalyzeBeatRequest {
  creativanta.common.v1.UUID workspace_id = 1;
  string audio_asset_id = 2;
  string audio_url = 3;
}

message SoundStudioServiceAnalyzeBeatResponse {
  double bpm = 1;
  repeated int64 beat_timestamps_ms = 2;
  repeated int64 downbeat_timestamps_ms = 3;
  double tempo_confidence = 4;
  repeated int64 suggested_cut_points_ms = 5;
}

message SoundStudioServiceListSoundLibraryRequest {
  creativanta.common.v1.UUID workspace_id = 1;
  string category = 2;
  string genre = 3;
  string mood = 4;
  creativanta.common.v1.Pagination pagination = 5;
}

message SoundStudioServiceListSoundLibraryResponse {
  repeated SoundTrack tracks = 1;
  creativanta.common.v1.PaginatedResponse pagination = 2;
}

message SoundStudioServiceGetSoundRequest {
  creativanta.common.v1.UUID workspace_id = 1;
  string asset_id = 2;
}

message SoundStudioServiceGetSoundResponse {
  SoundTrack track = 1;
}

message SoundStudioServicePreviewSoundRequest {
  creativanta.common.v1.UUID workspace_id = 1;
  string track_id = 2;
  int32 preview_start_ms = 3;
  int32 preview_duration_ms = 4;
}

message SoundStudioServicePreviewSoundResponse {
  string preview_url = 1;
  repeated float waveform_peaks = 2;
  bool is_free = 3;
}

// SoundStudioService manages background music generation, beat synchronization, SFX, and sound library (M07 EF-06).
service SoundStudioService {
  rpc GenerateMusic(SoundStudioServiceGenerateMusicRequest) returns (SoundStudioServiceGenerateMusicResponse);
  rpc GenerateSFX(SoundStudioServiceGenerateSFXRequest) returns (SoundStudioServiceGenerateSFXResponse);
  rpc AnalyzeBeat(SoundStudioServiceAnalyzeBeatRequest) returns (SoundStudioServiceAnalyzeBeatResponse);
  rpc ListSoundLibrary(SoundStudioServiceListSoundLibraryRequest) returns (SoundStudioServiceListSoundLibraryResponse);
  rpc GetSound(SoundStudioServiceGetSoundRequest) returns (SoundStudioServiceGetSoundResponse);
  rpc PreviewSound(SoundStudioServicePreviewSoundRequest) returns (SoundStudioServicePreviewSoundResponse);
}

// ============================================================================
// Voice Clone Messages (M08)
