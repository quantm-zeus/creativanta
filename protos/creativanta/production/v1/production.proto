message GetRecentAssetsResponse {
  repeated Asset assets = 1;
}

message CancelRequest {
  creativanta.common.v1.CommandContext context = 1;
  string job_id = 2;
}

message CancelResponse {
  GenerationJob job = 1;
  bool credits_refunded = 2;
  string refunded_credits = 3;
}

message RetryRequest {
  creativanta.common.v1.CommandContext context = 1;
  string job_id = 2;
  bool use_fallback_provider = 3;
}

message RetryResponse {
