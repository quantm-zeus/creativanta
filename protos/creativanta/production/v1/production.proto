}

// SoundStudioService manages background music generation, beat synchronization, SFX, and sound library (M07 EF-06).
service SoundStudioService {
  rpc GenerateMusic(SoundStudioServiceGenerateMusicRequest) returns (SoundStudioServiceGenerateMusicResponse);
  rpc GenerateSFX(SoundStudioServiceGenerateSFXRequest) returns (SoundStudioServiceGenerateSFXResponse);
  rpc AnalyzeBeat(SoundStudioServiceAnalyzeBeatRequest) returns (SoundStudioServiceAnalyzeBeatResponse);
  rpc ListSoundLibrary(SoundStudioServiceListSoundLibraryRequest) returns (SoundStudioServiceListSoundLibraryResponse);
  rpc GetSound(SoundStudioServiceGetSoundRequest) returns (SoundStudioServiceGetSoundResponse);
  rpc PreviewSound(SoundStudioServicePreviewSoundRequest) returns (SoundStudioServicePreviewSoundResponse);
}

