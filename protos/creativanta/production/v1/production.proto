// P4-08: M09 Derivative Service & M10 Packaging QA
// ============================================================================

message DerivativeItem {
  string asset_id = 1;
  string parent_asset_id = 2;
  string title = 3;
  string derivative_type = 4; // clip, variant, remix, repurpose, thumbnail
  string target_channel = 5;  // tiktok, youtube_shorts, instagram_reels, facebook
  string aspect_ratio = 6;
  string cta_variant = 7;
  string subtitle_language = 8;
  double duration_seconds = 9;
  string resolution = 10;
  string file_url = 11;
  string quality_state = 12;
  string generation_state = 13;
  repeated string tags = 14;
  int64 views = 15;
  double engagement_rate = 16;
  double ctr = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
  creativanta.common.v1.Money attributed_revenue = 20;
  int64 orders_count = 21;
  string rpm = 22;
  bool is_rpm_unknown = 23;
  string unknown_reason = 24;
  creativanta.common.v1.SourceClass source_class = 25;
  creativanta.common.v1.ConfidenceBand confidence = 26;
}

message BatchItemError {
  string asset_id = 1;
  string error_code = 2;
  string error_message = 3;
}

message DerivativeLineageNode {
  string asset_id = 1;
  string parent_asset_id = 2;
  string title = 3;
  string derivative_type = 4;
  string asset_type = 5;
  string quality_state = 6;
  int32 depth = 7;
  int64 views = 8;
  double engagement_rate = 9;
  double ctr = 10;
  bool is_source_deleted = 11;
  repeated DerivativeLineageNode children = 12;
}

message DerivativeStats {
  string source_asset_id = 1;
  int32 total_derivatives = 2;
  int64 aggregate_views = 3;
  double average_engagement_rate = 4;
  double average_ctr = 5;
  string top_performing_derivative_id = 6;
  repeated DerivativeItem top_derivatives = 7;
  bool is_views_unknown = 8;
  bool is_engagement_rate_unknown = 9;
  bool is_ctr_unknown = 10;
  string unknown_reason = 11;
  string selection_status = 12; // "conclusive", "low_exposure_inconclusive", "missing_denominator_unknown"
  creativanta.common.v1.Money aggregate_revenue = 13;
  int64 total_orders_attributed = 14;
  int64 unique_orders_counted = 15;
  creativanta.common.v1.ConfidenceBand confidence = 16;
  string average_rpm = 17;
  bool is_rpm_unknown = 18;
}

message DerivativeServiceListRequest {
  creativanta.common.v1.UUID workspace_id = 1;
  string source_asset_id = 2;
  string derivative_type = 3;
  string target_channel = 4;
  string status = 5;
  creativanta.common.v1.Pagination pagination = 6;
}

message DerivativeServiceListResponse {
  repeated DerivativeItem derivatives = 1;
  creativanta.common.v1.PaginatedResponse pagination = 2;
}

message DerivativeServiceCreateRequest {
  creativanta.common.v1.CommandContext context = 1;
  string parent_asset_id = 2;
  string derivative_type = 3;
  string target_channel = 4;
  string aspect_ratio = 5;
  string title = 6;
  string cta_variant = 7;
  string subtitle_language = 8;
  repeated string tags = 9;
  string prompt = 10;
}

message DerivativeServiceCreateResponse {
  DerivativeItem derivative = 1;
  string operation_id = 2;
}

message DerivativeServiceBatchTagRequest {
  creativanta.common.v1.CommandContext context = 1;
  repeated string asset_ids = 2;
  repeated string add_tags = 3;
  repeated string remove_tags = 4;
}

message DerivativeServiceBatchTagResponse {
  int32 total_items = 1;
  int32 succeeded_count = 2;
  int32 failed_count = 3;
