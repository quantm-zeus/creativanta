// VoiceCloneRecord represents a cloned voice profile linked to characters and consent records per database_schema.md §22.12.
message VoiceCloneRecord {
  string voice_clone_id = 1;
  string workspace_id = 2;
  string character_id = 3;
  string provider = 4;
  string provider_voice_id = 5;
  string voice_name = 6;
  repeated string sample_audio_urls = 7;
  string clone_status = 8;
  string consent_record_id = 9;
  double quality_score = 10;
  bool repair_applied = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message VoiceCloneServiceCreateRequest {
  creativanta.common.v1.CommandContext context = 1;
  string character_id = 2;
  string name = 3;
