}

message TranslationServiceListRequest {
  creativanta.common.v1.UUID workspace_id = 1;
  creativanta.common.v1.Pagination pagination = 2;
}

message TranslationServiceListResponse {
  repeated TranslationJob jobs = 1;
  creativanta.common.v1.PaginatedResponse pagination = 2;
