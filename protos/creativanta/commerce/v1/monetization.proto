// Checkout evaluation request/response connecting Offer, Coupon, Order and Ledger
message MonetizationServiceEvaluateCheckoutRequest {
  string workspace_id = 1;
  string offer_id = 2;
  string coupon_code = 3;
  string customer_entity_id = 4;
  repeated string product_ids = 5;
  string order_amount = 6;
  string currency = 7;
  creativanta.common.v1.CommandContext command_context = 8;
}

message MonetizationServiceEvaluateCheckoutResponse {
  bool accepted = 1;
  string error_code = 2; // e.g. ERR_OFFER_EXPIRED, ERR_COUPON_LIMIT_EXCEEDED, ERR_COUPON_EXPIRED
  string error_message = 3;
  string original_amount = 4;
  string discount_amount = 5;
  string net_payable_amount = 6;
  string currency = 7;
  string order_id = 8;
  string posting_id = 9;
  string coupon_id = 10;
  int32 coupon_remaining_uses = 11;
}

// Canonical Offer Service.
service OfferService {
  rpc Create(OfferServiceCreateRequest) returns (OfferServiceCreateResponse);
  rpc Get(OfferServiceGetRequest) returns (OfferServiceGetResponse);
  rpc List(OfferServiceListRequest) returns (OfferServiceListResponse);
  rpc Update(OfferServiceUpdateRequest) returns (OfferServiceUpdateResponse);
  rpc Activate(OfferServiceActivateRequest) returns (OfferServiceActivateResponse);
  rpc Pause(OfferServicePauseRequest) returns (OfferServicePauseResponse);
  rpc Resume(OfferServiceResumeRequest) returns (OfferServiceResumeResponse);
  rpc Expire(OfferServiceExpireRequest) returns (OfferServiceExpireResponse);
  rpc Retire(OfferServiceRetireRequest) returns (OfferServiceRetireResponse);
  rpc Duplicate(OfferServiceDuplicateRequest) returns (OfferServiceDuplicateResponse);
  rpc Delete(OfferServiceDeleteRequest) returns (OfferServiceDeleteResponse);
  rpc BulkPause(OfferServiceBulkPauseRequest) returns (OfferServiceBulkPauseResponse);
  rpc GetPerformance(OfferServiceGetPerformanceRequest) returns (OfferServiceGetPerformanceResponse);
  rpc GetRedemptionStats(OfferServiceGetRedemptionStatsRequest) returns (OfferServiceGetRedemptionStatsResponse);
  rpc GetStatusCounts(OfferServiceGetStatusCountsRequest) returns (OfferServiceGetStatusCountsResponse);
  rpc GetTabSummary(OfferServiceGetTabSummaryRequest) returns (OfferServiceGetTabSummaryResponse);
}

// Canonical Coupon Service.
service CouponService {
  rpc Create(CouponServiceCreateRequest) returns (CouponServiceCreateResponse);
  rpc Get(CouponServiceGetRequest) returns (CouponServiceGetResponse);
  rpc List(CouponServiceListRequest) returns (CouponServiceListResponse);
  rpc ValidateCoupon(CouponServiceValidateCouponRequest) returns (CouponServiceValidateCouponResponse);
  rpc Update(CouponServiceUpdateRequest) returns (CouponServiceUpdateResponse);
  rpc Activate(CouponServiceActivateRequest) returns (CouponServiceActivateResponse);
  rpc Pause(CouponServicePauseRequest) returns (CouponServicePauseResponse);
  rpc Resume(CouponServiceResumeRequest) returns (CouponServiceResumeResponse);
  rpc Deactivate(CouponServiceDeactivateRequest) returns (CouponServiceDeactivateResponse);
  rpc Delete(CouponServiceDeleteRequest) returns (CouponServiceDeleteResponse);
  rpc Revoke(CouponServiceRevokeRequest) returns (CouponServiceRevokeResponse);
  rpc CheckAvailability(CouponServiceCheckAvailabilityRequest) returns (CouponServiceCheckAvailabilityResponse);
}

// Canonical Campaign Service.
service CampaignService {
  rpc Create(CampaignServiceCreateRequest) returns (CampaignServiceCreateResponse);
  rpc Get(CampaignServiceGetRequest) returns (CampaignServiceGetResponse);
  rpc List(CampaignServiceListRequest) returns (CampaignServiceListResponse);
  rpc Update(CampaignServiceUpdateRequest) returns (CampaignServiceUpdateResponse);
