syntax = "proto3";

package creativanta.commerce.v1;

import "creativanta/common/v1/types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/quantm-zeus/creativanta/apps/api/gen/creativanta/commerce/v1;commercev1";

// Offer classifications per PRD §23.14 & DB Schema §10.2.
enum OfferType {
  OFFER_TYPE_UNSPECIFIED = 0;
  OFFER_TYPE_PRODUCT_OFFER = 1;
  OFFER_TYPE_DIGITAL_OFFER = 2;
  OFFER_TYPE_MEMBERSHIP_OFFER = 3;
  OFFER_TYPE_BUNDLE_OFFER = 4;
  OFFER_TYPE_AFFILIATE_OFFER = 5;
  OFFER_TYPE_SPONSOR_OFFER = 6;
}

// Canonical offer lifecycle state machine per RULE-M14-002.
enum OfferLifecycleState {
  OFFER_LIFECYCLE_STATE_UNSPECIFIED = 0;
  OFFER_LIFECYCLE_STATE_DRAFT = 1;
  OFFER_LIFECYCLE_STATE_REVIEW_REQUIRED = 2;
  OFFER_LIFECYCLE_STATE_ACTIVE = 3;
  OFFER_LIFECYCLE_STATE_PAUSED = 4;
  OFFER_LIFECYCLE_STATE_EXPIRED = 5;
  OFFER_LIFECYCLE_STATE_RETIRED = 6;
}

// Coupon classification per DB Schema §19.2.
enum CouponType {
  COUPON_TYPE_UNSPECIFIED = 0;
  COUPON_TYPE_PERCENTAGE = 1;
  COUPON_TYPE_FIXED_AMOUNT = 2;
  COUPON_TYPE_FREE_SHIPPING = 3;
}

// Canonical coupon lifecycle state machine per RULE-M14-003.
enum CouponLifecycleState {
  COUPON_LIFECYCLE_STATE_UNSPECIFIED = 0;
  COUPON_LIFECYCLE_STATE_DRAFT = 1;
  COUPON_LIFECYCLE_STATE_ACTIVE = 2;
  COUPON_LIFECYCLE_STATE_PAUSED = 3;
  COUPON_LIFECYCLE_STATE_EXPIRED = 4;
  COUPON_LIFECYCLE_STATE_RETIRED = 5;
  COUPON_LIFECYCLE_STATE_REVOKED = 6;
}

// Campaign classifications per DB Schema §10.5.
enum CampaignType {
  CAMPAIGN_TYPE_UNSPECIFIED = 0;
  CAMPAIGN_TYPE_CONTENT = 1;
  CAMPAIGN_TYPE_AFFILIATE = 2;
  CAMPAIGN_TYPE_SEEDING = 3;
  CAMPAIGN_TYPE_LIVE = 4;
  CAMPAIGN_TYPE_BRAND_COLLAB = 5;
}

// Canonical campaign lifecycle status per RULE-M14-004.
enum CampaignStatus {
  CAMPAIGN_STATUS_UNSPECIFIED = 0;
  CAMPAIGN_STATUS_PLANNED = 1;
  CAMPAIGN_STATUS_READY = 2;
  CAMPAIGN_STATUS_LIVE = 3;
  CAMPAIGN_STATUS_PAUSED = 4;
  CAMPAIGN_STATUS_COMPLETED = 5;
  CAMPAIGN_STATUS_CANCELLED = 6;
}

// Channel availability setting for an offer.
message ChannelAvailability {
  string platform = 1;
  bool enabled = 2;
}

// Canonical Offer model.
message Offer {
  string offer_id = 1;
  string workspace_id = 2;
  OfferType offer_type = 3;
  string product_id = 4;
  string product_less_declaration = 5;
  string title = 6;
  string pricing_value = 7;
  string pricing_currency = 8;
  string pricing_logic_json = 9;
  string cta_text = 10;
  string cta_url = 11;
  repeated ChannelAvailability channel_availability = 12;
  OfferLifecycleState lifecycle_state = 13;
  repeated string campaign_ids = 14;
  string metadata_json = 15;
  google.protobuf.Timestamp valid_from = 16;
  google.protobuf.Timestamp valid_until = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

// Canonical Coupon model.
message Coupon {
  string coupon_id = 1;
  string workspace_id = 2;
  string code = 3;
  CouponType coupon_type = 4;
  string discount_value = 5;
  string min_order_amount = 6;
  int32 max_uses = 7;
  int32 current_uses = 8;
  CouponLifecycleState lifecycle_state = 9;
  repeated string related_offer_ids = 10;
  repeated string related_campaign_ids = 11;
  google.protobuf.Timestamp valid_from = 12;
  google.protobuf.Timestamp valid_until = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

// Canonical Campaign model.
message Campaign {
  string campaign_id = 1;
  string workspace_id = 2;
  CampaignType campaign_type = 3;
  string title = 4;
  string objective = 5;
  CampaignStatus status = 6;
  string start_date = 7; // YYYY-MM-DD
  string end_date = 8;   // YYYY-MM-DD
  string budget = 9;
  string budget_currency = 10;
  repeated string related_product_ids = 11;
  repeated string related_offer_ids = 12;
  string metadata_json = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

// Coupon redemption record for ledger linkage.
message CouponRedemption {
  string redemption_id = 1;
  string workspace_id = 2;
  string coupon_id = 3;
  string order_id = 4;
  string discount_amount = 5;
  string currency = 6;
  google.protobuf.Timestamp redeemed_at = 7;
  string metadata_json = 8;
}

