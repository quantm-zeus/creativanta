syntax = "proto3";

package creativanta.finance.v1;

import "creativanta/common/v1/types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/quantm-zeus/creativanta/apps/api/gen/creativanta/finance/v1;financev1";

// Financial component breakdown per DB Schema §26.10 & Financial computation contract.
enum FinancialComponent {
  FINANCIAL_COMPONENT_UNSPECIFIED = 0;
  FINANCIAL_COMPONENT_REVENUE = 1;
  FINANCIAL_COMPONENT_PLATFORM_FEE = 2;
  FINANCIAL_COMPONENT_SHIPPING = 3;
  FINANCIAL_COMPONENT_COGS = 4;
  FINANCIAL_COMPONENT_AI_CREDITS = 5;
  FINANCIAL_COMPONENT_COMMISSION = 6;
  FINANCIAL_COMPONENT_ADS_SPEND = 7;
  FINANCIAL_COMPONENT_SEEDING = 8;
  FINANCIAL_COMPONENT_REFUND = 9;
  FINANCIAL_COMPONENT_OTHER = 10;
}

// Canonical reconciliation truth state machine per RULE-M19-007.
enum ReconciliationState {
  RECONCILIATION_STATE_UNSPECIFIED = 0;
  RECONCILIATION_STATE_IMPORTED_ONLY = 1;
  RECONCILIATION_STATE_AWAITING_EVIDENCE = 2;
  RECONCILIATION_STATE_INFERRED_PENDING_CONFIRMATION = 3;
  RECONCILIATION_STATE_PARTIALLY_RECONCILED = 4;
  RECONCILIATION_STATE_FULLY_RECONCILED = 5;
  RECONCILIATION_STATE_CONFLICT_DETECTED = 6;
  RECONCILIATION_STATE_MANUALLY_OVERRIDDEN = 7;
}

// Ingestion lifecycle for settlements per DB Schema §11.1.
enum SettlementState {
  SETTLEMENT_STATE_UNSPECIFIED = 0;
  SETTLEMENT_STATE_IMPORTED = 1;
  SETTLEMENT_STATE_NORMALIZED = 2;
  SETTLEMENT_STATE_READY_FOR_MATCHING = 3;
  SETTLEMENT_STATE_ARCHIVED = 4;
}

// Cost item state per DB Schema §11.2.
enum CostState {
  COST_STATE_UNSPECIFIED = 0;
  COST_STATE_RECORDED = 1;
  COST_STATE_PENDING_EVIDENCE = 2;
  COST_STATE_RECONCILED = 3;
  COST_STATE_ESTIMATED = 4;
  COST_STATE_SUPERSEDED = 5;
}

// Verification status for evidence objects per DB Schema §3.
enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_PENDING = 1;
  VERIFICATION_STATUS_VERIFIED = 2;
  VERIFICATION_STATUS_RE_VERIFY = 3;
  VERIFICATION_STATUS_FAILED = 4;
}

// Reference to related domain object (§11.4).
message ObjectRef {
  string type = 1;
  string id = 2;
}

// Immutable exchange rate snapshot captured at transaction time (§25.1).
message ExchangeRateSnapshot {
  string base_currency = 1;
  string quote_currency = 2;
  string rate_to_base = 3;
  string provider = 4;
  google.protobuf.Timestamp captured_at = 5;
  google.protobuf.Timestamp effective_at = 6;
  creativanta.common.v1.SourceClass source_class = 7;
}

// Financial posting record (append-only ledger §26.10).
message FinancialPosting {
  string posting_id = 1;
  string workspace_id = 2;
  string origin_type = 3;
  string origin_id = 4;
  string origin_version = 5;
  FinancialComponent component = 6;
  creativanta.common.v1.Money amount = 7; // signed base-currency effect
  creativanta.common.v1.SourceClass source_class = 8;
  creativanta.common.v1.ConfidenceBand confidence = 9;
  ExchangeRateSnapshot exchange_rate = 10;
  string reversal_of = 11;
  google.protobuf.Timestamp effective_at = 12;
  google.protobuf.Timestamp created_at = 13;
}

// Cost item record (§11.2).
message CostItem {
  string cost_item_id = 1;
  string workspace_id = 2;
  string cost_type = 3;
  creativanta.common.v1.Money amount = 4;
  string description = 5;
  string related_scope_type = 6;
  string related_scope_id = 7;
  creativanta.common.v1.SourceClass source_class = 8;
  string evidence_id = 9;
  string confidence_reason = 10;
  CostState cost_state = 11;
  string effective_date = 12; // YYYY-MM-DD
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

// Settlement line record (§26.9).
message SettlementLine {
  string line_id = 1;
  string workspace_id = 2;
  string settlement_id = 3;
  string external_line_id = 4;
  string external_order_id = 5;
  string order_id = 6;
  creativanta.common.v1.Money gross_amount = 7;
  creativanta.common.v1.Money fee_amount = 8;
  creativanta.common.v1.Money refund_amount = 9;
  creativanta.common.v1.Money net_amount = 10;
  creativanta.common.v1.Money matched_amount = 11;
  string currency = 12;
  ReconciliationState reconciliation_state = 13;
  google.protobuf.Timestamp created_at = 14;
}

// Platform settlement record (§11.1).
message Settlement {
  string settlement_id = 1;
  string workspace_id = 2;
  creativanta.common.v1.SourceClass source_class = 3;
  string source_platform = 4;
  string external_settlement_id = 5;
  string connected_account_id = 6;
  ExchangeRateSnapshot exchange_rate = 7;
  string import_fingerprint = 8;
  creativanta.common.v1.Money gross_amount = 9;
  creativanta.common.v1.Money net_amount = 10;
  string fees_json = 11;
  string deductions_json = 12;
  string currency = 13;
  SettlementState settlement_state = 14;
  ReconciliationState reconciliation_state = 15;
  repeated string related_order_ids = 16;
  string effective_date = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
  repeated SettlementLine lines = 20;
}

// Profit snapshot projection (§11.3).
message ProfitSnapshot {
  string snapshot_id = 1;
  string workspace_id = 2;
  string scope_type = 3;
  string scope_id = 4;
  string period_start = 5;
  string period_end = 6;
  creativanta.common.v1.Money gross_revenue = 7;
  creativanta.common.v1.Money platform_fees = 8;
  creativanta.common.v1.Money shipping_costs = 9;
  creativanta.common.v1.Money affiliate_commissions = 10;
  creativanta.common.v1.Money refund_deductions = 11;
  creativanta.common.v1.Money cogs = 12;
  creativanta.common.v1.Money ads_spend = 13;
  creativanta.common.v1.Money ai_credit_costs = 14;
  creativanta.common.v1.Money seeding_costs = 15;
  creativanta.common.v1.Money other_costs = 16;
  creativanta.common.v1.Money net_profit = 17;
  string margin_pct = 18;
  string source_class_mix_json = 19;
  creativanta.common.v1.ConfidenceBand confidence = 20;
  google.protobuf.Timestamp freshness_at = 21;
  string currency = 22;
  google.protobuf.Timestamp created_at = 23;
  bool is_incomplete = 24;
  int32 unknown_required_components_count = 25;
  creativanta.common.v1.Money pending_revenue = 26;
  creativanta.common.v1.Money unreconciled_amount = 27;
  int32 unreconciled_count = 28;
}

// Anomaly alert detected in profit/cost stream (§2.7.1).
message ProfitAnomaly {
  string anomaly_id = 1;
  string workspace_id = 2;
  string anomaly_type = 3;
  string severity = 4; // info, warning, critical
  string description = 5;
  creativanta.common.v1.Money expected_amount = 6;
  creativanta.common.v1.Money actual_amount = 7;
  google.protobuf.Timestamp detected_at = 8;
}

// Canonical reconciliation record per DB Schema §19.9E.
message ReconciliationRecord {
  string record_id = 1;
  string workspace_id = 2;
  string scope_type = 3; // order_batch, settlement_batch, affiliate_period, campaign
  string scope_description = 4;
  repeated string related_order_ids = 5;
  repeated string related_settlement_ids = 6;
  creativanta.common.v1.Money matched_amount = 7;
  creativanta.common.v1.Money discrepancy_amount = 8;
  string discrepancy_reason = 9;
  ReconciliationState reconciliation_state = 10;
  string currency = 11;
  string mismatches_json = 12;
  string override_reason = 13;
  string override_by = 14;
  google.protobuf.Timestamp override_at = 15;
  string period_start = 16;
  string period_end = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

// Partial match allocation linking a settlement line to an order (§4 capacity contract).
message ReconciliationMatch {
  string match_id = 1;
  string workspace_id = 2;
  string record_id = 3;
  string settlement_id = 4;
  string line_id = 5;
  string order_id = 6;
  creativanta.common.v1.Money allocated_amount = 7;
  string currency = 8;
  google.protobuf.Timestamp created_at = 9;
}

// Immutable evidence object with content_hash (SHA-512) per DB Schema §11.4 & RULE-M19-005.
message EvidenceObject {
  string evidence_id = 1;
  string workspace_id = 2;
  string evidence_type = 3; // screenshot, api_response, receipt, report, platform_data
  string source_provenance = 4;
  string content_hash = 5; // SHA-512 immutable hash
  string file_url = 6;
  string payload_json = 7;
  google.protobuf.Timestamp collected_at = 8;
  VerificationStatus verification_status = 9;
  repeated ObjectRef related_object_refs = 10;
  google.protobuf.Timestamp created_at = 11;
}

// Proof bundle assembling claims and evidence per DB Schema §11.5 & RULE-M19-006.
message ProofBundle {
  string proof_bundle_id = 1;
  string workspace_id = 2;
  string claim_scope = 3;
  string claim_summary = 4;
  repeated string supporting_evidence_ids = 5;
  string source_class_context_json = 6;
  creativanta.common.v1.ConfidenceBand confidence = 7;
  string coverage_summary = 8;
  string unresolved_gaps = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// Permission-filtered data gap item in the repair queue (RULE-M19-001, M01).
message DataGapItem {
  string gap_id = 1;
  string gap_type = 2; // missing_cogs, unreconciled_settlement, missing_evidence, stale_connector
  string severity = 3; // critical, warning, info
  string title = 4;
  string description = 5;
  string related_object_type = 6;
  string related_object_id = 7;
  creativanta.common.v1.Money monetary_amount = 8;
  google.protobuf.Timestamp unresolved_since = 9;
  string repair_cta_label = 10;
  string repair_cta_route = 11;
  string required_permission = 12;
}

// ============================================================================
// Service Requests & Responses
// ============================================================================

// ProfitService/GetSummary
message ProfitServiceGetSummaryRequest {
  string workspace_id = 1;
  string scope_type = 2; // workspace, product, platform, campaign, content
  string scope_id = 3;
  string period_start = 4; // YYYY-MM-DD
  string period_end = 5;   // YYYY-MM-DD
}

message ProfitServiceGetSummaryResponse {
  ProfitSnapshot snapshot = 1;
  map<string, string> component_breakdown = 2;
  map<string, double> source_class_percentages = 3;
}

// ProfitService/DrillDown
message ProfitServiceDrillDownRequest {
  string workspace_id = 1;
  string scope_type = 2;
  string scope_id = 3;
  string period_start = 4;
  string period_end = 5;
  string drilldown_by = 6; // product, platform, campaign, content, cost_type
}

message ProfitDrillDownItem {
  string key = 1;
  string label = 2;
  creativanta.common.v1.Money revenue = 3;
  creativanta.common.v1.Money costs = 4;
  creativanta.common.v1.Money net_profit = 5;
  creativanta.common.v1.ConfidenceBand confidence = 6;
  creativanta.common.v1.SourceClass primary_source_class = 7;
}

message ProfitServiceDrillDownResponse {
  repeated ProfitDrillDownItem items = 1;
  string currency = 2;
}

// ProfitService/GetAnomalies
message ProfitServiceGetAnomaliesRequest {
  string workspace_id = 1;
  string period_start = 2;
  string period_end = 3;
}

message ProfitServiceGetAnomaliesResponse {
  repeated ProfitAnomaly anomalies = 1;
}

// ProfitService/GetSnapshot
message ProfitServiceGetSnapshotRequest {
  string workspace_id = 1;
  string snapshot_id = 2;
  string scope_type = 3;
  string scope_id = 4;
  string period_start = 5;
  string period_end = 6;
}

message ProfitServiceGetSnapshotResponse {
  ProfitSnapshot snapshot = 1;
}

// ProfitService/RefreshSnapshot
message ProfitServiceRefreshSnapshotRequest {
  creativanta.common.v1.CommandContext context = 1;
  string workspace_id = 2;
  string scope_type = 3;
  string scope_id = 4;
  string period_start = 5;
  string period_end = 6;
}

message ProfitServiceRefreshSnapshotResponse {
  ProfitSnapshot snapshot = 1;
}

// SettlementService/Import
message SettlementLineInput {
  string external_line_id = 1;
  string external_order_id = 2;
  creativanta.common.v1.Money gross_amount = 3;
  creativanta.common.v1.Money fee_amount = 4;
  creativanta.common.v1.Money refund_amount = 5;
  creativanta.common.v1.Money net_amount = 6;
}

message SettlementServiceImportRequest {
  creativanta.common.v1.CommandContext context = 1;
  string workspace_id = 2;
  string source_platform = 3;
  string external_settlement_id = 4;
  string connected_account_id = 5;
  creativanta.common.v1.Money gross_amount = 6;
  creativanta.common.v1.Money net_amount = 7;
  string currency = 8;
  string effective_date = 9;
  string import_fingerprint = 10;
  repeated SettlementLineInput lines = 11;
  ExchangeRateSnapshot exchange_rate = 12;
}

message SettlementServiceImportResponse {
  Settlement settlement = 1;
  int32 imported_lines_count = 2;
  bool already_existed = 3;
}

// SettlementService/List
message SettlementServiceListRequest {
  string workspace_id = 1;
  creativanta.common.v1.Pagination pagination = 2;
  string source_platform = 3;
  SettlementState settlement_state = 4;
  ReconciliationState reconciliation_state = 5;
}

message SettlementServiceListResponse {
  repeated Settlement settlements = 1;
  creativanta.common.v1.PaginatedResponse pagination = 2;
}

// SettlementService/Get
message SettlementServiceGetRequest {
  string workspace_id = 1;
  string settlement_id = 2;
}

message SettlementServiceGetResponse {
  Settlement settlement = 1;
}

// CostService/Create
message CostServiceCreateRequest {
  creativanta.common.v1.CommandContext context = 1;
  string workspace_id = 2;
  string cost_type = 3;
  creativanta.common.v1.Money amount = 4;
  string description = 5;
  string related_scope_type = 6;
  string related_scope_id = 7;
  creativanta.common.v1.SourceClass source_class = 8;
  string evidence_id = 9;
  string confidence_reason = 10;
  string effective_date = 11;
}

message CostServiceCreateResponse {
  CostItem cost_item = 1;
}

// CostService/List
message CostServiceListRequest {
  string workspace_id = 1;
  creativanta.common.v1.Pagination pagination = 2;
  string cost_type = 3;
  string related_scope_type = 4;
  string related_scope_id = 5;
  string period_start = 6;
  string period_end = 7;
}

message CostServiceListResponse {
  repeated CostItem cost_items = 1;
  creativanta.common.v1.PaginatedResponse pagination = 2;
}

// CostService/Update
message CostServiceUpdateRequest {
  creativanta.common.v1.CommandContext context = 1;
  string workspace_id = 2;
  string cost_item_id = 3;
  creativanta.common.v1.Money amount = 4;
  string description = 5;
  string cost_type = 6;
  creativanta.common.v1.SourceClass source_class = 7;
  CostState cost_state = 8;
}

message CostServiceUpdateResponse {
  CostItem cost_item = 1;
}

// CostService/Delete
message CostServiceDeleteRequest {
  creativanta.common.v1.CommandContext context = 1;
  string workspace_id = 2;
  string cost_item_id = 3;
}

message CostServiceDeleteResponse {
  bool success = 1;
}

// ============================================================================
// ReconciliationService Requests & Responses
// ============================================================================

message ReconciliationServiceQueueRequest {
  creativanta.common.v1.CommandContext context = 1;
  string workspace_id = 2;
  string scope_type = 3;
  string scope_description = 4;
  repeated string order_ids = 5;
  repeated string settlement_ids = 6;
  string period_start = 7;
  string period_end = 8;
}

message ReconciliationServiceQueueResponse {
  ReconciliationRecord record = 1;
}

message ReconciliationServiceMatchRequest {
  creativanta.common.v1.CommandContext context = 1;
  string workspace_id = 2;
  string settlement_id = 3;
  string line_id = 4;
  string order_id = 5;
  creativanta.common.v1.Money allocation_amount = 6;
  string record_id = 7;
}

message ReconciliationServiceMatchResponse {
  bool success = 1;
  SettlementLine line = 2;
  ReconciliationState order_reconciliation_state = 3;
  creativanta.common.v1.Money line_remaining_capacity = 4;
  creativanta.common.v1.Money order_remaining_capacity = 5;
  ReconciliationRecord record = 6;
  ReconciliationMatch match = 7;
}

message ReconciliationServiceManualMatchRequest {
  creativanta.common.v1.CommandContext context = 1;
  string workspace_id = 2;
  string settlement_id = 3;
  string line_id = 4;
  string order_id = 5;
  creativanta.common.v1.Money allocation_amount = 6;
  string record_id = 7;
}

message ReconciliationServiceManualMatchResponse {
  bool success = 1;
  SettlementLine line = 2;
  ReconciliationState order_reconciliation_state = 3;
  creativanta.common.v1.Money line_remaining_capacity = 4;
  creativanta.common.v1.Money order_remaining_capacity = 5;
  ReconciliationRecord record = 6;
  ReconciliationMatch match = 7;
}

message ReconciliationServiceOverrideRequest {
  creativanta.common.v1.CommandContext context = 1;
  string workspace_id = 2;
  string record_id = 3;
  string decision = 4; // accepted_discrepancy, force_reconciled, manual_override
  string reason = 5;
  repeated string evidence_ids = 6;
}

message ReconciliationServiceOverrideResponse {
  ReconciliationRecord record = 1;
}

message ReconciliationServiceGetRecordRequest {
  string workspace_id = 1;
  string record_id = 2;
}

message ReconciliationServiceGetRecordResponse {
  ReconciliationRecord record = 1;
  repeated ReconciliationMatch matches = 2;
}

message ReconciliationServiceListRecordsRequest {
  string workspace_id = 1;
  creativanta.common.v1.Pagination pagination = 2;
  ReconciliationState reconciliation_state = 3;
  string period_start = 4;
  string period_end = 5;
}

message ReconciliationServiceListRecordsResponse {
  repeated ReconciliationRecord records = 1;
  creativanta.common.v1.PaginatedResponse pagination = 2;
}

message ReconciliationServiceListPendingRequest {
  string workspace_id = 1;
  creativanta.common.v1.Pagination pagination = 2;
  string severity = 3;
  string gap_type = 4;
  string period_start = 5;
  string period_end = 6;
  string product_id = 7;
}

message ReconciliationServiceListPendingResponse {
  repeated DataGapItem items = 1;
  creativanta.common.v1.PaginatedResponse pagination = 2;
  int32 missing_components_count = 3;
  creativanta.common.v1.Money total_unreconciled_amount = 4;
  int32 unreconciled_count = 5;
}

// ============================================================================
// EvidenceService Requests & Responses
// ============================================================================

message EvidenceServiceSubmitRequest {
  creativanta.common.v1.CommandContext context = 1;
  string workspace_id = 2;
  string evidence_type = 3;
  string source_provenance = 4;
  string content_hash = 5;
  string file_url = 6;
  string payload_json = 7;
  repeated ObjectRef related_object_refs = 8;
  bytes raw_content = 9;
}

message EvidenceServiceSubmitResponse {
  EvidenceObject evidence = 1;
}

message EvidenceServiceGetRequest {
  string workspace_id = 1;
  string evidence_id = 2;
}

message EvidenceServiceGetResponse {
  EvidenceObject evidence = 1;
}

message EvidenceServiceListRequest {
  string workspace_id = 1;
  creativanta.common.v1.Pagination pagination = 2;
  string evidence_type = 3;
  string verification_status = 4;
}

message EvidenceServiceListResponse {
  repeated EvidenceObject items = 1;
  creativanta.common.v1.PaginatedResponse pagination = 2;
}

// ============================================================================
// ProofService Requests & Responses
// ============================================================================

message ProofServiceAssembleRequest {
  creativanta.common.v1.CommandContext context = 1;
  string workspace_id = 2;
  string claim_scope = 3;
  string claim_summary = 4;
  repeated string supporting_evidence_ids = 5;
  creativanta.common.v1.ConfidenceBand confidence = 6;
  string coverage_summary = 7;
  string unresolved_gaps = 8;
}

message ProofServiceAssembleResponse {
  ProofBundle proof_bundle = 1;
}

message ProofServiceGetRequest {
  string workspace_id = 1;
  string proof_bundle_id = 2;
}

message ProofServiceGetResponse {
  ProofBundle proof_bundle = 1;
}

message ProofServiceListRequest {
  string workspace_id = 1;
  creativanta.common.v1.Pagination pagination = 2;
  string claim_scope = 3;
}

message ProofServiceListResponse {
  repeated ProofBundle proof_bundles = 1;
  creativanta.common.v1.PaginatedResponse pagination = 2;
}

// ============================================================================
// Service Definitions
// ============================================================================

service ProfitService {
  rpc GetSummary(ProfitServiceGetSummaryRequest) returns (ProfitServiceGetSummaryResponse);
  rpc DrillDown(ProfitServiceDrillDownRequest) returns (ProfitServiceDrillDownResponse);
  rpc GetAnomalies(ProfitServiceGetAnomaliesRequest) returns (ProfitServiceGetAnomaliesResponse);
  rpc GetSnapshot(ProfitServiceGetSnapshotRequest) returns (ProfitServiceGetSnapshotResponse);
  rpc RefreshSnapshot(ProfitServiceRefreshSnapshotRequest) returns (ProfitServiceRefreshSnapshotResponse);
}

service SettlementService {
  rpc Import(SettlementServiceImportRequest) returns (SettlementServiceImportResponse);
  rpc List(SettlementServiceListRequest) returns (SettlementServiceListResponse);
  rpc Get(SettlementServiceGetRequest) returns (SettlementServiceGetResponse);
}

service CostService {
  rpc Create(CostServiceCreateRequest) returns (CostServiceCreateResponse);
  rpc List(CostServiceListRequest) returns (CostServiceListResponse);
  rpc Update(CostServiceUpdateRequest) returns (CostServiceUpdateResponse);
  rpc Delete(CostServiceDeleteRequest) returns (CostServiceDeleteResponse);
}

service ReconciliationService {
  rpc Queue(ReconciliationServiceQueueRequest) returns (ReconciliationServiceQueueResponse);
  rpc Match(ReconciliationServiceMatchRequest) returns (ReconciliationServiceMatchResponse);
  rpc ManualMatch(ReconciliationServiceManualMatchRequest) returns (ReconciliationServiceManualMatchResponse);
  rpc Override(ReconciliationServiceOverrideRequest) returns (ReconciliationServiceOverrideResponse);
  rpc GetRecord(ReconciliationServiceGetRecordRequest) returns (ReconciliationServiceGetRecordResponse);
  rpc ListRecords(ReconciliationServiceListRecordsRequest) returns (ReconciliationServiceListRecordsResponse);
  rpc ListPending(ReconciliationServiceListPendingRequest) returns (ReconciliationServiceListPendingResponse);
}

service EvidenceService {
  rpc Submit(EvidenceServiceSubmitRequest) returns (EvidenceServiceSubmitResponse);
  rpc Get(EvidenceServiceGetRequest) returns (EvidenceServiceGetResponse);
  rpc List(EvidenceServiceListRequest) returns (EvidenceServiceListResponse);
}

service ProofService {
  rpc Assemble(ProofServiceAssembleRequest) returns (ProofServiceAssembleResponse);
  rpc Get(ProofServiceGetRequest) returns (ProofServiceGetResponse);
  rpc List(ProofServiceListRequest) returns (ProofServiceListResponse);
}
