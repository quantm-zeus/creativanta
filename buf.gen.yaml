version: v2
plugins:
  - local: protoc-gen-go
    out: apps/api/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: apps/api/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-es
    out: packages/shared-types/src
    opt:
      - target=ts
  - local: protoc-gen-dart
    out: apps/mobile/lib/generated
    opt:
      - grpc
